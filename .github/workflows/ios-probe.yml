# TEMPORARY (branch iosci, not for main).
#
# The thesis: a capture depends on device state nothing owns, so erasing the
# device before pinning it should make history irrelevant. The direct test is
# to capture the whole catalogue twice on one runner -- once on a device
# nothing has touched, once after the stages that precede goldens in a real
# verification run -- and require the two to be byte-identical.
#
# Identical means erase neutralises history and the remaining diffs against
# the committed baselines are the honest ones: every diff is then one setting
# `pin()` does not name, by name.
#
# The host's own locale is recorded because an erased device inherits it, so
# this Mac and this runner do not start from the same place.
name: iOS capture probe

on:
  workflow_dispatch:
  push:
    branches: [iosci]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: Erased catalogue, isolated and after a full run
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Record what this machine inherits from
        run: |
          sw_vers
          echo "AppleLocale: $(defaults read -g AppleLocale 2>/dev/null || echo unset)"
          echo "AppleLanguages: $(defaults read -g AppleLanguages 2>/dev/null | tr -d '\n')"
          echo "AppleICUForce24HourTime: $(defaults read -g AppleICUForce24HourTime 2>/dev/null || echo unset)"
          echo "AppleKeyboards: $(defaults read -g AppleKeyboards 2>/dev/null | tr -d '\n')"
          defaults read com.apple.iphonesimulator DevicePreferences 2>/dev/null || echo "no DevicePreferences"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Build the app for the golden simulator
        # The restored cache can carry an xcframework whose binary it did not
        # keep, and the bridge recipe then calls it current. Start clean.
        run: |
          rm -rf target/ios
          just ios build
      - name: Capture the catalogue on a device nothing has touched
        run: |
          just ios goldens || true
          mkdir -p target/ios/probe
          cp -R target/ios/goldens/actual target/ios/probe/isolated
      - name: Record what the erased device settled on
        run: |
          UDID=$(xcrun simctl list devices -j | python3 -c "import json,sys;print(next(d['udid'] for v in json.load(sys.stdin)['devices'].values() for d in v if d['name']=='amux-golden'))")
          for key in AppleLanguages AppleLocale AppleICUForce24HourTime AppleKeyboards AppleKeyboardsExpanded ApplePasscodeKeyboards AddingEmojiKeybordHandled; do
            echo "$key: $(xcrun simctl spawn $UDID defaults read .GlobalPreferences $key 2>/dev/null | tr -d '\n' || echo unset)"
          done
          xcrun simctl spawn $UDID defaults read com.apple.keyboard.preferences 2>/dev/null || echo "no keyboard preferences"
      - name: Run the stages that precede goldens in a real verification
        run: |
          just ios loopback-smoke || true
          just ios unit || true
          just ios door-smoke || true
      - name: Capture the catalogue again, after all of that
        run: |
          just ios goldens || true
          cp -R target/ios/goldens/actual target/ios/probe/after-a-run
      - name: Are the two passes byte-identical?
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          a = pathlib.Path("target/ios/probe/isolated")
          b = pathlib.Path("target/ios/probe/after-a-run")
          def digests(root):
              return {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(root.glob("*.png"))}
          da, db = digests(a), digests(b)
          only_a = sorted(set(da) - set(db))
          only_b = sorted(set(db) - set(da))
          differ = sorted(n for n in set(da) & set(db) if da[n] != db[n])
          print(f"isolated: {len(da)} captures, after-a-run: {len(db)}")
          if only_a: print("only in the isolated pass:", ", ".join(only_a))
          if only_b: print("only in the second pass:", ", ".join(only_b))
          print(f"differing between passes: {len(differ)}")
          for name in differ:
              print("  ", name)
          if not (only_a or only_b or differ):
              print("IDENTICAL: erase neutralised everything the run did")
          PY
      - name: Upload both passes and the triplets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-frames
          path: |
            target/ios/probe
            target/ios/goldens
          if-no-files-found: warn
          retention-days: 7
