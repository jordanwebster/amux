# TEMPORARY (branch iosci, not for main).
#
# The first probe showed that a golden capture passes on a GitHub runner when
# it runs on its own, so the runner is not the difference. This one asks what
# is: drive the app through the UI-test suites first, capture without the
# restart, then capture again with it.
#
# Expected, if the diagnosis holds: the first capture carries the home
# indicator and fails, the second does not and passes. Every frame of both
# settle loops is uploaded either way.
name: iOS capture probe

on:
  workflow_dispatch:
  push:
    branches: [iosci]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    name: Capture after a UI-test session
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Build the app for the golden simulator
        run: just ios build
      - name: Drive the app through the unit suites
        run: just ios unit || true
      - name: Capture without restarting the device
        env:
          AMUX_DOOR_PROBE: target/ios/probe/driven
          AMUX_SKIP_CAPTURE_RESTART: "1"
        run: just ios goldens dictation-denied || true
      - name: Capture after restarting the device
        env:
          AMUX_DOOR_PROBE: target/ios/probe/restarted
        run: just ios goldens dictation-denied || true
      - name: Upload every frame of both settle loops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-frames
          path: target/ios/probe
          if-no-files-found: warn
          retention-days: 7
