name: CI

on:
  push:
    branches: [main, nativeapp]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: |
          cargo check --workspace --all-targets
          # These live suites are opt-in (`test = false`), so all-targets does
          # not select them unless they are named explicitly.
          cargo check -p amux \
            --test claude_pty_live \
            --test codex_live \
            --test claude_sdk_live

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  codegen:
    name: Protobuf codegen is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate committed protobuf code
        run: cargo run -p xtask -- codegen
      - name: Committed output matches the protos
        run: |
          if [ -n "$(git status --porcelain crates/amux/src/protocol/generated)" ]; then
            git --no-pager diff -- crates/amux/src/protocol/generated
            echo "::error::committed protobuf codegen is stale; run 'cargo run -p xtask -- codegen' and commit the result"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p amux \
            --test claude_pty_live \
            --test codex_live \
            --test claude_sdk_live \
            -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Run spec tests
        run: cargo test --workspace --test spec
        env:
          AMUX_INVARIANT_FATAL: "1"

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --workspace --release

  e2e:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # Windows disabled: ConPTY screen-rendering artifacts need further work
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Run E2E tests
        run: cargo run -p e2e-runner -- run
        env:
          AMUX_INVARIANT_FATAL: "1"

  client-only:
    name: Client-only (embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The embedded client build (`default-features = false`) drops the
      # local-agent runtime. Integration tests (embedded.rs, spec) assume that
      # runtime, so they are intentionally excluded here — lib only.
      - name: Build amux (no default features)
        run: cargo build -p amux --no-default-features
      - name: Test amux lib (no default features)
        run: cargo test -p amux --lib --no-default-features
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Clippy amux (no default features)
        run: cargo clippy -p amux --no-default-features -- -D warnings

  ios:
    name: ios
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: |
          brew install coreutils xcodegen
          case "$(uname -m)" in
            arm64) archive=wt-aarch64-apple-darwin ;;
            x86_64) archive=wt-x86_64-apple-darwin ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/wt-bin"
          cd "$RUNNER_TEMP/wt-bin"
          curl --fail --location --retry 3 --max-time 120 -O "https://github.com/jordanwebster/wt/releases/download/v0.3.0/$archive.tar.gz"
          curl --fail --location --retry 3 --max-time 120 -O "https://github.com/jordanwebster/wt/releases/download/v0.3.0/$archive.sha256"
          shasum -a 256 -c "$archive.sha256"
          tar -xzf "$archive.tar.gz"
          echo "$RUNNER_TEMP/wt-bin" >> "$GITHUB_PATH"
      - name: Register checkout with wt
        run: timeout 60 wt register . --label amux
      - name: Run iOS verification
        # The runner is not a Mac anybody wrote a hardware row for, so it names
        # the budget row it is measured against rather than being identified by
        # its model. Until that row's baseline has been recorded, the measured
        # run is skipped with a line saying which file is missing.
        env:
          AMUX_PERF_MACHINE: macos-26
        run: timeout 9000 wt run ios-verify
      - name: What a failed verification drew
        # A golden that differs here and nowhere else can only be read by
        # looking at what this machine drew, so the captures leave with the
        # run. Expected, actual and diff sit side by side per screen.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verification-captures
          path: |
            target/ios/goldens
            target/ios/journeys
          if-no-files-found: ignore
          retention-days: 7
