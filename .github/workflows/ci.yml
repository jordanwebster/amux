name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check-and-clippy:
    name: Check and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check workspace
        run: just check
      - name: Run Clippy
        run: just lint

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check formatting
        run: just fmt-check

  codegen-and-policy:
    name: Codegen and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check committed protobuf code
        run: just codegen-check
      - name: Check the protos only add to the committed baseline
        run: just proto-check
      - name: Enforce dependency boundaries
        run: just dependency-policy
      - name: Check the test suite catalogue
        run: just tests-check
      - name: Check the documentation's links, figures and map
        run: just docs-check
      - name: Check nothing names a removed mechanism
        run: just deletion-ledger-check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - uses: dtolnay/rust-toolchain@1.98.0
      # Named, because the weekly offline tests restore the macOS one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: extractions/setup-just@v2
      - name: Run workspace tests
        # Report every failing test binary, not only the first: a platform
        # that stops early hides the failures behind it until the next run.
        # This is the fast lane and, on Linux and macOS, the system lane too:
        # the built amux binary's process, attach, overlap and supervise_cli
        # suites, node's supervisor suite and the survive-daemon system
        # journey are ordinary test targets, compiled out on Windows.
        run: just test -- --no-fail-fast
      - name: Run doctests
        run: just doctest
      - name: Check every design contract names tests that exist
        # The contracts name tests of Unix processes, PTYs and sockets that
        # Windows does not build, and the check is the one `just ci` runs on
        # a Mac, so it runs where that listing matches.
        if: runner.os == 'macOS'
        run: just contracts-check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Build product release
        run: just release-check

  terminal-journeys:
    name: Terminal journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Run terminal journeys
        run: |
          just journey terminal reach-host
          just journey terminal conversation-decision-claude-pty
          just journey terminal conversation-decision-claude-sdk
          just journey terminal conversation-decision-codex
          just journey terminal leave-and-recover
          just journey terminal manage-agent
          just journey terminal attachment-or-review
          just journey terminal keep-authority

  embedded:
    name: Embedded client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check provider-free client graph
        run: just embedded-check
      - name: Test embedded ownership boundary
        run: just embedded-test

  ios:
    name: iOS target check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check iOS device and simulator graphs
        run: just mobile-check

  # A change reaches the phone only through these paths. Whatever else the
  # bridge reads crosses to Swift as the generated mirrors in apps/apple,
  # which a workspace test holds to the Rust definitions, so a shape change
  # upstream cannot land without touching the app. Behaviour upstream is the
  # workspace tests' to judge; the iOS target check above compiles the
  # bridge's graph on every push.
  ios-changes:
    name: iOS changes
    runs-on: ubuntu-latest
    outputs:
      phone: ${{ steps.filter.outputs.phone }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            phone:
              - 'apps/apple/**'
              - 'crates/app-ffi/**'
              - 'crates/app-embedded/**'
              - 'crates/app-runtime/**'
              - 'crates/xtask/**'
              - 'scripts/**'
              - 'justfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  ios-gate:
    name: iOS gate
    needs: ios-changes
    if: needs.ios-changes.outputs.phone == 'true'
    runs-on: macos-26
    # The gate builds the app and runs the suites one simulator can answer.
    # The capture suites are not here: see `just ios captures`.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Refuse fixture update flags
        shell: bash
        run: scripts/no-update-flags.sh
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # Named, because the nightly iOS captures job restores it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-gate
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Run the iOS gate
        run: just ios gate
      - name: Upload component snapshot comparisons and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-component-snapshots
          path: target/ios/component-snapshots
          if-no-files-found: warn
          retention-days: 7
      - name: Upload the shipped-scope audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scope-audit
          path: target/ios/scope-audit
          if-no-files-found: warn
          retention-days: 7
