name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.3.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run declared check
        run: wt run ci-check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly-2026-08-30
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly-2026-08-30 fmt --all -- --check

  codegen:
    name: Protobuf codegen is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate committed protobuf code
        run: scripts/codegen-check.sh
      - name: Committed output matches the protos
        run: |
          if [ -n "$(git status --porcelain crates/wire/src/generated)" ]; then
            git --no-pager diff -- crates/wire/src/generated
            echo "::error::committed protobuf codegen is stale; run 'cargo run -p xtask -- codegen' and commit the result"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p amux \
            --test claude_pty_live \
            --test codex_live \
            --test claude_sdk_live \
            -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.3.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run declared tests
        run: wt run ci-test
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Run specs and doctests
        run: |
          wt run spec
          wt run doctest
        env:
          AMUX_INVARIANT_FATAL: "1"

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.3.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Build product release
        run: wt run release-check

  e2e:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # Windows disabled: ConPTY screen-rendering artifacts need further work
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Run E2E tests
        run: target/debug/e2e-runner run --amux-binary target/debug/amux --test-agent-binary target/debug/test-agent
        env:
          AMUX_INVARIANT_FATAL: "1"

  client-only:
    name: Client-only (embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The embedded client build (`default-features = false`) drops the
      # local-agent runtime. Integration tests (embedded.rs, spec) assume that
      # runtime, so they are intentionally excluded here — lib only.
      - name: Build amux (no default features)
        run: cargo build -p amux --no-default-features
      - name: Test amux lib (no default features)
        run: cargo test -p amux --lib --no-default-features
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Clippy amux (no default features)
        run: cargo clippy -p amux --no-default-features -- -D warnings

  ios:
    name: iOS target check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      # Cross-check the lib for the targets the React Native app builds
      # (device + both simulator arches). This exercises the `target_os = "ios"`
      # paths that host builds never compile, and confirms `portable-pty` stays
      # out of the embedded build.
      - name: Check amux for iOS device + simulator targets
        run: |
          cargo check -p amux --no-default-features --target aarch64-apple-ios
          cargo check -p amux --no-default-features --target aarch64-apple-ios-sim
          cargo check -p amux --no-default-features --target x86_64-apple-ios
