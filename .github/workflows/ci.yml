name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --workspace --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  codegen:
    name: Protobuf codegen is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate committed protobuf code
        run: cargo run -p xtask -- codegen
      - name: Committed output matches the protos
        run: |
          if [ -n "$(git status --porcelain crates/amux/src/protocol/generated)" ]; then
            git --no-pager diff -- crates/amux/src/protocol/generated
            echo "::error::committed protobuf codegen is stale; run 'cargo run -p xtask -- codegen' and commit the result"
            exit 1
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --all-targets
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Run spec tests
        run: cargo test --workspace --test spec
        env:
          AMUX_INVARIANT_FATAL: "1"

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --workspace --release

  e2e:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # Windows disabled: ConPTY screen-rendering artifacts need further work
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Run E2E tests
        run: cargo run -p e2e-runner -- run
        env:
          AMUX_INVARIANT_FATAL: "1"

  client-only:
    name: Client-only (embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The embedded client build (`default-features = false`) drops the
      # local-agent runtime. Integration tests (embedded.rs, spec) assume that
      # runtime, so they are intentionally excluded here — lib only.
      - name: Build amux (no default features)
        run: cargo build -p amux --no-default-features
      - name: Test amux lib (no default features)
        run: cargo test -p amux --lib --no-default-features
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Clippy amux (no default features)
        run: cargo clippy -p amux --no-default-features -- -D warnings

  ios:
    name: iOS target check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      # Cross-check the lib for the targets the React Native app builds
      # (device + both simulator arches). This exercises the `target_os = "ios"`
      # paths that host builds never compile, and confirms `portable-pty` stays
      # out of the embedded build.
      - name: Check amux for iOS device + simulator targets
        run: |
          cargo check -p amux --no-default-features --target aarch64-apple-ios
          cargo check -p amux --no-default-features --target aarch64-apple-ios-sim
          cargo check -p amux --no-default-features --target x86_64-apple-ios
