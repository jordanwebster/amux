name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run declared check
        run: wt run ci-check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly-2026-08-30
        with:
          components: rustfmt
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - name: Check formatting
        run: wt run format-check

  codegen:
    name: Protobuf codegen is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Check committed protobuf code
        run: wt run codegen-check

  policy:
    name: Dependency and recipe policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Enforce dependency boundaries and recipe behavior
        run: |
          wt run dependency-policy
          wt run test-recipes

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: wt lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run declared tests
        run: wt run ci-test
        env:
          AMUX_INVARIANT_FATAL: "1"
      - name: Run doctests
        run: wt run doctest
        env:
          AMUX_INVARIANT_FATAL: "1"

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Build product release
        run: wt run release-check

  e2e:
    name: E2E Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        # Native Windows cannot run wt 0.4.0; declared tasks run on POSIX hosts.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Run declared E2E tests
        run: wt run e2e
        env:
          AMUX_INVARIANT_FATAL: "1"

  client-only:
    name: Client-only (embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Check provider-free client graph
        run: wt run embedded-check
      - name: Test embedded ownership boundary
        run: wt run embedded-test
        env:
          AMUX_INVARIANT_FATAL: "1"

  ios:
    name: iOS target check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Check provider-free iOS device and simulator graphs
        run: wt run mobile-check
