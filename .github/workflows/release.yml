name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: amux-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: amux-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: amux-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p amux-cli --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.os == 'windows-latest' && format('target/{0}/release/amux.exe', matrix.target) || format('target/{0}/release/amux', matrix.target) }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/amux-linux-x86_64/amux amux-linux-x86_64
          mv artifacts/amux-macos-arm64/amux amux-macos-arm64
          mv artifacts/amux-windows-x86_64/amux.exe amux-windows-x86_64.exe

      - name: Generate checksums
        run: sha256sum amux-linux-x86_64 amux-macos-arm64 amux-windows-x86_64.exe > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            amux-linux-x86_64
            amux-macos-arm64
            amux-windows-x86_64.exe
            checksums.txt
          generate_release_notes: true
