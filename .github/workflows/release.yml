name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: amux-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: amux-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned task runner
        run: cargo install wt --version 0.4.0 --locked

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: wt run release-check -- --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/amux

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries
        run: |
          mv artifacts/amux-linux-x86_64/amux amux-linux-x86_64
          mv artifacts/amux-macos-arm64/amux amux-macos-arm64

      - name: Generate checksums
        run: sha256sum amux-linux-x86_64 amux-macos-arm64 > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            amux-linux-x86_64
            amux-macos-arm64
            checksums.txt
          generate_release_notes: true
