# Component snapshots also run on pull requests. This workflow adds the slower
# full-display composition checks nightly, and the real interaction journeys,
# accessibility sweep and performance qualification when dispatched by hand.
# The manifest names the component coverage replacing redundant display states;
# `just ios goldens --all` still runs the historical full-screen catalogue.
name: iOS captures

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AMUX_INVARIANT_FATAL: "1"

jobs:
  captures:
    name: iOS captures
    runs-on: macos-26
    # The capture suites boot both pinned devices and photograph every
    # catalogued screen in both appearances. Leave room for the uploads.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Boot both pinned simulators
        run: just ios simulator
      - name: Compare native component snapshots
        run: just ios component-snapshots
      - name: Compare full-screen composition goldens
        if: github.event_name == 'schedule'
        run: just ios goldens
      - name: Run the capture suites
        # The runner uses its own recorded baseline when one is committed.
        # Without one, the measured run records that it was not measured.
        if: github.event_name != 'schedule'
        env:
          AMUX_PERF_MACHINE: macos-26
        run: just ios captures
      - name: Pair preserved design references
        if: always()
        run: just ios goldens-reference
      - name: Upload performance results and limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-performance
          path: |
            target/ios/perf
            apps/apple/Perf/baselines
          if-no-files-found: warn
          retention-days: 7
      - name: Upload golden triplets, reference pairs and journeys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-captures
          path: |
            target/ios/goldens
            target/ios/journeys
            target/ios/component-snapshots
          if-no-files-found: warn
          retention-days: 7
