# The half of iPhone verification that drives a running app and judges what it
# drew: the door smoke, the golden catalogue, the journeys, the accessibility
# sweep and the measured run.
#
# It is not on the push path, for two reasons that point the same way. It is
# the slow half — the gate answers in half an hour, this takes hours — and it
# is the half that photographs a simulator, so it reports on the machine
# holding the camera as well as on the app. A change to the app should not
# wait on either.
#
# DISABLED ON PURPOSE: on demand only, no schedule.
#
# 117 of the 124 captures currently fail on a GitHub runner and pass on a
# developer's Mac, and nobody has explained why. 107 of them differ only in
# the bottom 64 pixels of the screen, and by the same thing: the home
# indicator, the bar a Face ID iPhone draws for swiping up to the home screen.
# The runner photographs it, a developer's Mac does not, on identical Xcode
# and simulator runtime builds. Erasing the
# device to factory state before capturing does not change it, and neither
# does rebooting. Until that is understood, a nightly run would be red every
# night for a reason nobody could act on, which teaches people to stop reading
# it. Restore the schedule below when the captures agree.
name: iOS captures

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AMUX_INVARIANT_FATAL: "1"

jobs:
  captures:
    name: iOS captures
    runs-on: macos-26
    # The capture suites boot both pinned devices and photograph every
    # catalogued screen in both appearances. Leave room for the uploads.
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - name: Assert simulator runtime and device type
        run: |
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-26-5" and .isAvailable == true)'
          xcrun simctl list devicetypes --json | jq -e '.devicetypes[] | select(.identifier == "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro")'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Boot both pinned simulators
        run: just ios simulator
      - name: Run the capture suites
        # The runner uses its own recorded baseline when one is committed.
        # Without one, the measured run records that it was not measured.
        env:
          AMUX_PERF_MACHINE: macos-26
        run: just ios captures
      - name: Pair preserved design references
        if: always()
        run: just ios goldens-reference
      - name: Upload performance results and limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-performance
          path: |
            target/ios/perf
            apps/apple/Perf/baselines
          if-no-files-found: warn
          retention-days: 7
      - name: Upload golden triplets, reference pairs and journeys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-captures
          path: |
            target/ios/goldens
            target/ios/journeys
          if-no-files-found: warn
          retention-days: 7
