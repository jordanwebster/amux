# Throwaway: prove the golden catalogue is green on a runner with both pinned
# devices booted, which is the condition under which the home indicator stays.
name: iOS catalogue check

on:
  workflow_dispatch:
  push:
    branches: [goldens-determinism]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  catalogue:
    name: Golden catalogue with both devices booted
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install build tools
        run: brew install xcodegen
      - name: Boot both pinned simulators
        run: just ios simulator
      - name: Compare the golden catalogue
        run: just ios goldens
      - name: Upload golden triplets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-${{ github.sha }}
          path: target/ios/goldens
          retention-days: 7
