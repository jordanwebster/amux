name: Weekly offline tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  AMUX_INVARIANT_FATAL: "1"

jobs:
  offline-test:
    name: Offline workspace tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Run without external network access
        run: just offline-test
