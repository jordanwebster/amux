[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/amux-cli"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal
amux = { path = "crates/amux" }
amux-ui = { path = "crates/amux-ui" }
amux-tui = { path = "crates/amux-tui" }

# Shared
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal", "test-util"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
protoc-bin-vendored = "3"
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
gethostname = "0.5"
oauth2 = "4"
async-trait = "0.1"
# default-features off to avoid enabling both ring and aws-lc-rs (reqwest
# already activates ring; having both makes rustls panic at runtime).
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
ring = "0.17"
curve25519-dalek = "4.1"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
semver = "1"
sha2 = "0.10"
fs2 = "0.4"
socket2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.101"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tempfile = "3"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
shell-words = "1"
bytes = "1"
qrcode = { version = "0.14", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
