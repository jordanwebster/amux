[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/amux-cli"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal
amux = { path = "crates/amux" }

# Shared
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "test-util"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
protoc-bin-vendored = "3"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
gethostname = "0.5"
oauth2 = "4"
# default-features off to avoid enabling both ring and aws-lc-rs (reqwest
# already activates ring; having both makes rustls panic at runtime).
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false }
webpki-roots = "0.26"
rustls-pemfile = "2"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
semver = "1"
sha2 = "0.10"
fs2 = "0.4"
socket2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.101"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tempfile = "3"
crossterm = "0.28"
shell-words = "1"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
