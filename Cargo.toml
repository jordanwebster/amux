[workspace]
resolver = "2"
members = [
    "crates/agent-runtime",
    "crates/amux",
    "crates/node",
    "crates/shot",
    "crates/tui",
    "crates/ui-runtime",
    "crates/ui-state",
    "crates/artifacts",
    "crates/claude",
    "crates/claude-specs",
    "crates/codex",
    "crates/codex-specs",
    "crates/client",
    "crates/e2e-runner",
    "crates/host-api",
    "crates/model",
    "crates/pty-host",
    "crates/redaction",
    "crates/replay-support",
    "crates/settings",
    "crates/test-agent",
    "crates/testnet",
    "crates/wire",
    "crates/xtask",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal
agent-runtime = { path = "crates/agent-runtime" }
node = { path = "crates/node" }
testnet = { path = "crates/testnet" }
client = { path = "crates/client" }
host-api = { path = "crates/host-api" }
model = { path = "crates/model" }
wire = { path = "crates/wire" }
settings = { path = "crates/settings" }
artifacts = { path = "crates/artifacts" }
ui-runtime = { path = "crates/ui-runtime" }
ui-state = { path = "crates/ui-state" }
tui = { path = "crates/tui" }
pty-host = { path = "crates/pty-host" }
claude = { path = "crates/claude" }
redaction = { path = "crates/redaction" }

# Shared
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "fs", "signal", "test-util"] }
tokio-util = "0.7"
libc = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8.23"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
gethostname = "1"
oauth2 = "5"
async-trait = "0.1"
# default-features off to avoid enabling both ring and aws-lc-rs (reqwest
# already activates ring; having both makes rustls panic at runtime).
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
rustls-pemfile = "2"
ring = "0.17"
curve25519-dalek = "4.1"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
semver = "1"
sha2 = "0.10"
fontdue = "0.9"
gif = "0.14.2"
png = "0.17.16"
# The system clipboard, for pasting an image or a file into a chat draft.
arboard = "3.6"
socket2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.101"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tempfile = "3"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "serde"] }
shell-words = "1"
glob = "0.3"
bytes = "1"
# The ONE computed diff seam: the ask-time Edit preview
# (`docs/CHAT.md` §Diffs — everything else restates
# `structuredPatch` facts).
similar = "3"
qrcode = { version = "0.14", default-features = false }
nix = { version = "0.31", features = ["process", "signal"] }

# Cargo defaults macOS debug profiles to split-debuginfo = "unpacked", which
# keeps every codegen unit's object file under target/<profile>/deps for the
# debugger and never removes it; with incremental compilation each rebuild
# leaves the previous session's objects behind. Measured at 26 GiB of the
# canonical's 45 GiB target and 158 GiB in one worktree. "packed" keeps one
# dSYM per product binary instead (dsymutil runs at link, for a few binaries).
# The Apple-only rustflag lives in .cargo/config.toml so Windows never receives
# a split-debuginfo value it does not support. Development and tests share this
# profile so each workspace crate has one reusable configuration.
[profile.dev]
debug = "line-tables-only"
incremental = true
panic = "unwind"

[profile.release]
panic = "abort"
incremental = false

[profile.full-debug]
inherits = "dev"
debug = 2

# Workspace crates keep full debuginfo; dependencies drop theirs.
[profile.dev.package."*"]
debug = false
