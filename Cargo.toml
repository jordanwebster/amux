[package]
name = "amux"
version = "0.1.0"
edition = "2021"
description = "Agent multiplexer - transparent CLI wrapper for Claude"

[workspace]
members = [".", "test-agent", "e2e-runner"]

[dependencies]
portable-pty = "0.8"
tokio = { version = "1", features = ["full", "io-util", "net", "sync", "rt-multi-thread", "macros"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tokio-tungstenite = "0.21"
futures-util = "0.3"
nanoid = "0.4"
gethostname = "0.5"
oauth2 = "4"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-pemfile = "2"
jsonwebtoken = "10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dirs = "6"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde"] }
[dev-dependencies]
tempfile = "3"
