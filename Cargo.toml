[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/amux-cli"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Internal
amux = { path = "crates/amux" }
amux-ui = { path = "crates/amux-ui" }
amux-tui = { path = "crates/amux-tui" }

# Shared
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "fs", "signal", "test-util"] }
tokio-util = "0.7"
libc = "0.2"
signal-hook = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
gethostname = "1"
oauth2 = "5"
async-trait = "0.1"
# default-features off to avoid enabling both ring and aws-lc-rs (reqwest
# already activates ring; having both makes rustls panic at runtime).
tokio-rustls = { version = "0.26", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
rustls-pemfile = "2"
ring = "0.17"
curve25519-dalek = "4.1"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "ring"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
semver = "1"
sha2 = "0.10"
socket2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.101"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tempfile = "3"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
shell-words = "1"
glob = "0.3"
bytes = "1"
# The ONE computed diff seam: the ask-time Edit preview
# (notes/chat-v1/diff-rendering.md §3.1 — everything else restates
# `structuredPatch` facts).
similar = "3"
qrcode = { version = "0.14", default-features = false }
nix = { version = "0.31", features = ["process", "signal"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
