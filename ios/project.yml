name: Amux

options:
  bundleIdPrefix: sh.amux
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: "2.46.0"
  generateEmptyDirectories: true

# Three configurations, not two. `Measured` is how the performance suite is
# built: optimised the way a shipped build is, because an unoptimised Swift
# build measures the compiler rather than the app, but with the driving door,
# the fixtures and the workload generator still compiled in and `@testable`
# still allowed, because the suite runs inside the app and reaches into it.
# Nobody installs a `Measured` build; `Release` is still what ships.
configs:
  Debug: debug
  Measured: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    # The Rust bridge is assembled for arm64 alone (scripts/ios-rust.py), the
    # phone is arm64 and every simulator this is measured on runs on Apple
    # silicon. An Intel slice would be a second configuration nobody builds
    # and nobody would notice going stale.
    ARCHS: arm64

packages:
  AmuxCore:
    path: Packages/AmuxCore
  AmuxDesign:
    path: Packages/AmuxDesign
  AmuxFeatures:
    path: Packages/AmuxFeatures
  AmuxShell:
    path: Packages/AmuxShell
  AmuxTestSupport:
    path: Packages/AmuxTestSupport

targets:
  Amux:
    type: application
    platform: iOS
    sources:
      - path: Amux/Sources
      # The driving door and everything that opens a screen without a host.
      # Release compiles none of it (see EXCLUDED_SOURCE_FILE_NAMES below).
      - path: Amux/Debug
      # Fixtures, the scripted cloud and the door's wire types are compiled
      # into the debug build rather than linked as a package. Xcode
      # force-loads a Swift package's static library whether or not anything
      # references it, so depending on AmuxTestSupport here would put every
      # fixture in the shipped binary; compiling its sources lets the release
      # configuration leave them out entirely.
      - path: Packages/AmuxTestSupport/Sources/AmuxTestSupport
        excludes:
          - "Resources/**"
      # The picture a report fixture is frozen on, bundled rather than
      # compiled: a report screen is a photograph of another screen, so a
      # declared report state has to carry one. Release leaves it out with the
      # rest of the fixtures.
      - path: Packages/AmuxTestSupport/Sources/AmuxTestSupport/Resources
        buildPhase: resources
      # The performance harness, for the same reason: the workloads it
      # generates are forty invented agents and a thousand invented rows, and
      # none of that belongs in a build a person installs.
      - path: Packages/AmuxCore/Sources/Instrumentation
      - path: Amux/Resources
        buildPhase: resources
      # The two subscriptions, as the App Store would describe them, so a
      # purchase can be driven on the simulator without a sandbox account.
      # Named by the scheme rather than compiled in: it is a debugger setting,
      # and a build a person installs never sees it.
      - path: Amux/Amux.storekit
        buildPhase: none
    info:
      path: Amux/Info.plist
      properties:
        CFBundleDisplayName: Amux
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSSpeechRecognitionUsageDescription: Dictate messages with speech recognition on this iPhone.
        NSMicrophoneUsageDescription: Use the microphone to dictate into your message.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Pairing links printed by the CLI (`amux://pair?payload=...`) and the
        # callback the web sign-in returns to. Arriving here pairs with nobody
        # and signs nobody in; the app asks first.
        CFBundleURLTypes:
          - CFBundleURLName: sh.amux.app
            CFBundleURLSchemes: [amux]
        # The transcript is measured against the display's full cadence; the
        # 120 Hz cap iOS applies by default would hide hitches behind it.
        CADisableMinimumFrameDurationOnPhone: true
    postBuildScripts:
      - name: Stamp build revision
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        script: |
          set -eu
          revision=$(git -C "$SRCROOT/.." rev-parse --verify HEAD)
          /usr/bin/plutil -replace AmuxGitSHA -string "$revision" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    settings:
      base:
        # Git worktree metadata can live outside SRCROOT. The revision phase
        # reads it each build and updates only the built app's Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Amux/Amux.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.app
        SWIFT_EMIT_LOC_STRINGS: YES
        # XcodeGen gives an iOS target iPhone and iPad by default; this app is
        # designed for the phone only.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG AMUX_DEBUG_TOOLS
          # The debug build links the bridge built with its driving tools:
          # the plaintext loopback relay a test runner speaks, and the
          # recorder snapshot a report is written from. Force-loading it
          # first means every bridge symbol is already defined by the time
          # the shipping archive the package carries is reached, so nothing
          # is taken from that one. `wt run ios-door-smoke` reads the build
          # marker back out of the running app and checks that the release
          # binary does not carry it.
          OTHER_LDFLAGS: -Wl,-force_load,$(SRCROOT)/../target/ios/AmuxMobileDebugTools.xcframework/ios-arm64-simulator/libamux_mobile.a
        Measured:
          # The same tools as Debug, and for the same reason: the suite drives
          # the app through the door and measures the workloads the harness
          # generates, so a build without them cannot be measured at all. What
          # it does not carry is DEBUG, so the app and the packages behind it
          # are compiled the way a shipped build is.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: AMUX_DEBUG_TOOLS
          OTHER_LDFLAGS: -Wl,-force_load,$(SRCROOT)/../target/ios/AmuxMobileDebugTools.xcframework/ios-arm64-simulator/libamux_mobile.a
          # The suite is `@testable import Amux`: it builds the app's own
          # screens and reads the app's own stores, which is what makes the
          # numbers the app's rather than a UI test's.
          ENABLE_TESTABILITY: YES
        Release:
          # Belt as well as the AMUX_DEBUG_TOOLS braces: the debug sources
          # are not compiled at all, so a door symbol or a fixture cannot
          # reach a shipped binary by way of a stray reference outside a
          # conditional. `wt run ios-door-smoke` checks the built binary.
          EXCLUDED_SOURCE_FILE_NAMES: "$(SRCROOT)/Amux/Debug/* $(SRCROOT)/Packages/AmuxTestSupport/Sources/AmuxTestSupport/* $(SRCROOT)/Packages/AmuxTestSupport/Sources/AmuxTestSupport/Resources/* $(SRCROOT)/Packages/AmuxCore/Sources/Instrumentation/*"
    dependencies:
      - package: AmuxCore
        product: AmuxCore
      - package: AmuxDesign
        product: AmuxDesign
      - package: AmuxFeatures
        product: AmuxFeatures
      - package: AmuxShell
        product: AmuxShell

  # The performance suite runs inside the app it measures: it generates the
  # pinned workloads, hands them to the runtime's own callback and reads the
  # marks the app leaves. A UI test could not — it drives the app from another
  # process, and the gap between the two processes would be in every number.
  AmuxPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AmuxPerformanceTests
    # The suite names the packages' types but must not depend on their
    # products. A test bundle that lists a package product turns that package
    # into a dynamic framework for every target in the configuration, and each
    # of those frameworks carries its own copy of the Rust bridge — so the
    # app's `-force_load` of the driving bridge above stops answering and the
    # measured app silently loses the door's network. Taking the types from the
    # host instead keeps the packages static and the bridge single: the modules
    # are already built into `BUILT_PRODUCTS_DIR` for the host, so `import
    # AmuxCore` still resolves, and `BUNDLE_LOADER` resolves the symbols
    # against the app executable that already links them.
    dependencies:
      - target: Amux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.AmuxPerformanceTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amux.app/Amux"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Measured:
          # A test bundle gets testability for nothing in a debug
          # configuration and not in a release one, and this suite is
          # `@testable import Amux` in an optimised build.
          ENABLE_TESTABILITY: YES

  # Keychain access belongs to the signed process. These tests run in the
  # actual app so disabling its signing cannot pass through a package runner.
  AmuxAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AmuxAppTests
    dependencies:
      - target: Amux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.AmuxAppTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Amux.app/Amux"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  AmuxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AmuxUITests
    dependencies:
      - target: Amux
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.amux.AmuxUITests
        TEST_TARGET_NAME: Amux
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  Amux:
    build:
      targets:
        Amux: all
        AmuxUITests: [test]
        AmuxAppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Amux/Amux.storekit
    test:
      config: Debug
      # The package unit suites run from their own package schemes (see
      # scripts/ios-unit.py); this action carries the UI tests, which the
      # journey plans select from, and the app-hosted Keychain tests.
      targets:
        - AmuxUITests
        - AmuxAppTests

  # Its own scheme, because a performance run must never share a process or a
  # machine with another suite.
  AmuxPerformance:
    build:
      targets:
        Amux: all
        AmuxPerformanceTests: [test]
    run:
      config: Measured
    test:
      config: Measured
      # Coverage instruments every call and a sanitizer rewrites every access;
      # both would be measured as if they were the app.
      gatherCoverageData: false
      targets:
        - AmuxPerformanceTests
