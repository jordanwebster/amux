# wt coordination. Each checkout — the main one included — runs its own amux instance:
# socket, state, identity and log under `.wt/amux/`, found through
# AMUX_CONFIG, with the checkout's own build first on PATH.

bin = ["target/debug"]
commands = ["amux"]

[env]
AMUX_CONFIG = "{{root()}}/.wt/amux/profile.yaml"
AMUX_LOG = "{{root()}}/.wt/amux/amux.log"
AMUX_INVARIANT_FATAL = "1"

[files.".wt/amux/installation.yaml"]
marker = "#"
content = """
host_name: {{name_short()}}
root: {{root()}}/.wt/amux
front_door_socket: {{root()}}/.wt/amux/amux.sock
keymaps_dir: {{root()}}/.wt/amux/keymaps
prevent_idle_sleep: false
"""

# One dependency graph for everything below: `build` compiles tests and
# examples too (without running them), so `test`, `lint` and `spec` reuse
# its artifacts instead of producing variants of their own.
[task.profile-config]
run = ["python3", "scripts/worktree-profile.py", "{{root()}}/.wt/amux", "{{name()}}"]
exists = 'test -f "$AMUX_CONFIG"'

[task.build]
run = "cargo build --workspace --all-targets"
needs = ["profile-config"]

[task.test]
run = 'scripts/workspace-test.sh "$@"'

[task.lint]
run = "cargo clippy --workspace --all-targets -- -D warnings"

# Selected by target name across the workspace rather than by package:
# a `-p` selection unifies dependency features differently from the
# workspace build and would compile a second copy of every shared crate.
[task.spec]
run = 'scripts/spec-test.sh "$@"'

# The iOS library builds without `local-agents`. The check always names the
# target so it never produces a host variant of the workspace.
[task.mobile-check]
run = "timeout 900 sh scripts/mobile-check.sh"

[task.embed-test]
run = "AMUX_EMBED_TEST=1 CARGO_TARGET_DIR=target/embed cargo test -p amux --no-default-features --test embedding -- --nocapture"

# The rules the screens package is written to: SwiftUI only outside a
# registered leaf, no platform conditionals, no spinners. Pure text, so it runs
# before anything is compiled and says which line is wrong.
[task.ios-lint]
run = "timeout 300 sh ios/Tools/feature-lint.sh"

[task.ios-rust]
run = "timeout 1800 python3 scripts/ios-rust.py"

# The pinned devices every capture and measurement runs on. Creating them is
# idempotent; they are left booted because every later recipe needs them up.
[task.ios-simulator]
run = "timeout 900 python3 -B scripts/ios_simulators.py"

# Generates ios/Amux.xcodeproj from ios/project.yml, then builds the app. The
# bridge XCFramework is an input, so ios-rust runs first.
[task.ios-build]
run = "timeout 1800 python3 -B scripts/ios-build.py"
needs = ["ios-rust"]

# The package unit suites. Arguments are xcodebuild's; a `-only-testing:`
# selector picks the package that owns the named target.
[task.ios-unit]
run = 'timeout 1800 python3 -B scripts/ios-unit.py "$@"'
needs = ["ios-rust"]

# Launch the debug build, open a named state through the driving door, read
# the screen back, photograph it, and connect its shared runtime to a test
# relay. The workspace build that produces the runner is an input alongside
# the app.
[task.ios-door-smoke]
run = "timeout 1800 python3 -B scripts/ios-door-smoke.py"
needs = ["ios-build", "build"]

# Capture the manifest's screens in both appearances and compare each one
# with its baseline. No arguments means the whole manifest, which fails on any
# screen nobody has built yet rather than skipping it.
[task.ios-goldens]
run = 'timeout 2400 python3 -B scripts/ios-goldens.py "$@"'
needs = ["ios-build"]

# Move one design token and require the golden run to fail with a difference
# image. What proves the golden check would notice a change.
[task.ios-goldens-perturb]
run = 'timeout 1200 python3 -B scripts/ios-goldens-perturb.py "$@"'
needs = ["ios-build"]

# Rebuild the screen a recorded report bundle was written with: fold its
# runtime recording into fresh stores, apply the view-state trace beside it and
# photograph the result. Nothing is connected and no recorded effect is run.
[task.ios-replay]
run = 'timeout 1800 python3 -B scripts/ios-replay.py "$@"'
needs = ["ios-build"]

# The app driven the way a person drives it, against a real relay and real
# daemons started from a committed topology. No arguments runs every journey
# ios/Journeys/manifest.json declares.
[task.ios-journey]
run = 'timeout 2400 python3 -B scripts/ios-journey.py "$@"'
needs = ["ios-build", "build"]

# Pair every reference screen's baseline with the design's preserved capture.
# A report and never a gate: a difference from the design is a conversation.
[task.ios-goldens-reference]
run = 'timeout 900 cargo run -q -p xtask -- golden reference'

# The measured run: the pinned workloads against the budgets in
# docs/IOS_PERFORMANCE.md, on a machine that document has a row for.
[task.ios-perf]
run = 'timeout 2700 python3 -B scripts/ios-perf.py "$@"'
needs = ["ios-rust"]

[task.ios-loopback-smoke]
run = "timeout 1800 python3 -B ios/Tools/loopback_smoke.py"
needs = ["build"]

[task.ios-verify]
run = "scripts/ios-verify.sh"

[task.ci-status]
run = 'timeout 3300 cargo run -q -p xtask -- ci-status "$@"'

[task.ci-gate]
run = "scripts/ci-gate.sh"

[task.ci-observe]
run = 'scripts/ci-observe.sh "$@"'

# Regenerates the committed protobuf code (crates/amux/src/protocol/generated)
# after a proto change. Not a build step: the output is committed, and CI
# fails when it goes stale.
[task.protobuf]
run = "cargo run -p xtask -- codegen"

[task.e2e]
run = 'timeout 900 target/debug/e2e-runner run --amux-binary target/debug/amux --test-agent-binary target/debug/test-agent "$@"'
needs = ["build"]

[task.testnet]
run = 'timeout 3600 e2e-runner testnet "$@"'
needs = ["build"]

[task.testnet-smoke]
run = 'scripts/workspace-test.sh testnet_ -- --nocapture --test-threads=1'

# This checkout's daemon. A resource: `wt remove` stops it.
[task.daemon]
tied_to = "tree"
name = "{{name_short()}}"
needs = ["build"]
exists = "amux profiles >/dev/null 2>&1"
run = "amux server start"
destroy = "amux server stop"
