# wt owns the tree, its environment and its daemon; `just --list` is the task list.

bin = ["target/debug"]
commands = ["amux"]

[env]
AMUX_CONFIG = "{{root()}}/.wt/amux/profile.yaml"
AMUX_LOG = "{{root()}}/.wt/amux/amux.log"
AMUX_INVARIANT_FATAL = "1"

[files.".wt/amux/installation.yaml"]
marker = "#"
content = """
host_name: {{name_short()}}
root: {{root()}}/.wt/amux
front_door_socket: {{root()}}/.wt/amux/amux.sock
keymaps_dir: {{root()}}/.wt/amux/keymaps
prevent_idle_sleep: false
"""

[task.profile-config]
run = ["python3", "scripts/worktree-profile.py", "{{root()}}/.wt/amux", "{{name()}}"]
exists = 'test -f "$AMUX_CONFIG"'

[task.build]
run = "just build"
needs = ["profile-config"]

[task.test]
run = 'just test "$@"'

[task.lint]
run = "just lint"

[task.fmt]
run = "just fmt"

[task.warm]
run = "just warm"

# This checkout's daemon. A resource: `wt remove` stops it.
[task.daemon]
tied_to = "tree"
name = "{{name_short()}}"
needs = ["build"]
exists = 'test -S "{{root()}}/.wt/amux/amux.sock" && amux profiles >/dev/null 2>&1'
run = "amux server start"
destroy = "amux server stop"
