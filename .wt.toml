# wt coordination. Each checkout — the main one included — runs its own amux instance:
# socket, state, identity and log under `.wt/amux/`, found through
# AMUX_CONFIG, with the checkout's own build first on PATH.

bin = ["target/debug"]
commands = ["amux"]

[env]
AMUX_CONFIG = "{{root()}}/.wt/amux/profile.yaml"
AMUX_LOG = "{{root()}}/.wt/amux/amux.log"
AMUX_INVARIANT_FATAL = "1"

[files.".wt/amux/installation.yaml"]
marker = "#"
content = """
host_name: {{name_short()}}
root: {{root()}}/.wt/amux
front_door_socket: {{root()}}/.wt/amux/amux.sock
keymaps_dir: {{root()}}/.wt/amux/keymaps
prevent_idle_sleep: false
"""

# Product work does not compile test, example, generator or live-provider
# targets. Those targets have explicit recipes below.
[task.profile-config]
run = ["python3", "scripts/worktree-profile.py", "{{root()}}/.wt/amux", "{{name()}}"]
exists = 'test -f "$AMUX_CONFIG"'

[task.build]
run = "scripts/with-git-revision.sh timeout 900 cargo build --locked -p amux -p shot --bins"
needs = ["profile-config"]

[task.check]
run = "scripts/with-git-revision.sh timeout 900 cargo check --locked --workspace --lib --bins"

[task.test-build]
run = "scripts/with-git-revision.sh timeout 1200 cargo test --locked --workspace --lib --tests --no-run"

[task.doctest]
run = "scripts/with-git-revision.sh timeout 600 cargo test --locked --workspace --doc"

[task.full-debug]
run = "scripts/with-git-revision.sh timeout 900 cargo build --locked -p amux -p shot --bins --profile full-debug"

[task.ci-check]
run = "scripts/with-git-revision.sh timeout 900 cargo check --locked --workspace --lib --bins --profile ci"

[task.ci-test]
run = "scripts/with-git-revision.sh timeout 1200 cargo test --locked --workspace --lib --tests --profile ci-test"

[task.release-check]
run = 'scripts/with-git-revision.sh timeout 1200 cargo build --locked --release -p amux -p shot --bins "$@"'

[task.format-check]
run = "cargo +nightly-2026-08-30 fmt --all -- --check"

[task.format]
run = "cargo +nightly-2026-08-30 fmt --all"

[task.codegen-check]
run = "scripts/with-git-revision.sh timeout 600 scripts/codegen-check.sh"

[task.offline-test]
run = "scripts/with-git-revision.sh timeout 1200 scripts/offline-check.sh cargo test --locked --workspace --lib --tests"

[task.build-acceptance]
run = 'timeout 3600 python3 scripts/build-acceptance.py "$@"'

# What the canonical is kept warm with: the configurations every tree
# inherits through wt's snapshot of it. `wt anchor` runs this in place of
# `build`, in the background, after every tree creation and removal.
[task.warm]
needs = ["build", "test-build"]

[task.test]
run = 'scripts/with-git-revision.sh scripts/workspace-test.sh "$@"'
needs = ["test-recipes"]

[task.test-recipes]
run = "timeout 30 python3 scripts/tests/workspace_test.py"

[task.test-model]
run = "scripts/with-git-revision.sh timeout 120 cargo test --locked -p model"

[task.test-artifacts]
run = "scripts/with-git-revision.sh timeout 300 cargo test --locked -p artifacts"

[task.test-wire]
run = "scripts/with-git-revision.sh timeout 300 cargo test --locked -p wire"

[task.test-settings]
run = "scripts/with-git-revision.sh timeout 300 cargo test --locked -p settings"

[task.test-client]
run = "scripts/with-git-revision.sh timeout 300 cargo test --locked -p client"

[task.test-host-api]
run = "scripts/with-git-revision.sh timeout 300 cargo test --locked -p host-api"

[task.check-agent-runtime]
run = "scripts/with-git-revision.sh timeout 600 cargo check --locked -p agent-runtime"

[task.check-node-boundary]
run = "scripts/with-git-revision.sh timeout 600 cargo check --locked -p node --lib"

[task.check-products]
run = "scripts/with-git-revision.sh timeout 900 cargo check --locked -p node -p agent-runtime -p amux --bins"

[task.test-node-lifecycle]
run = "scripts/with-git-revision.sh timeout 600 cargo test --locked -p node --lib installation::supervisor::tests::lifecycle_waits_for_profile_mutations_and_closed_gate_rejects_late_agent_work"

[task.test-node]
run = 'scripts/with-git-revision.sh timeout 900 cargo test --locked -p node --lib "$@"'

[task.test-ui-state]
run = "scripts/with-git-revision.sh timeout 600 cargo test --locked -p ui-state"

[task.test-ui-runtime]
run = "scripts/with-git-revision.sh timeout 900 cargo test --locked -p ui-runtime"

[task.test-tui]
run = "scripts/with-git-revision.sh timeout 900 cargo test --locked -p tui"

[task.test-shot]
run = "scripts/with-git-revision.sh timeout 900 cargo test --locked -p shot"

[task.test-infrastructure]
run = "scripts/with-git-revision.sh timeout 600 cargo test --locked -p testnet -p claude-specs -p codex-specs -p tui-fixtures"

[task.dependency-policy]
run = "timeout 60 python3 scripts/check-dependency-policy.py"

[task.lint]
run = "scripts/with-git-revision.sh cargo clippy --locked --workspace --all-targets -- -D warnings"

[task.fix-lints]
run = "scripts/with-git-revision.sh cargo fix --locked -p node -p agent-runtime --lib --allow-dirty"

# Selected by target name across the workspace rather than by package:
# a `-p` selection unifies dependency features differently from the
# workspace build and would compile a second copy of every shared crate.
[task.spec]
run = 'scripts/with-git-revision.sh scripts/spec-test.sh "$@"'

# Opt-in real-Codex scenarios. The CLI must match the current sources.
[task.codex-live]
run = 'scripts/with-git-revision.sh timeout 900 cargo test --locked -p node --test codex_live --features test-support -- "$@"'
needs = ["build"]

[task.claude-pty-live]
run = 'scripts/with-git-revision.sh timeout 900 cargo test --locked -p node --test claude_pty_live --features test-support -- "$@"'
needs = ["build"]

[task.claude-sdk-live]
run = 'scripts/with-git-revision.sh timeout 900 cargo test --locked -p node --test claude_sdk_live --features test-support -- "$@"'
needs = ["build"]

[task.live-harness-check]
run = "scripts/with-git-revision.sh timeout 900 cargo test --locked -p node --features test-support --test codex_live --test claude_pty_live --test claude_sdk_live --no-run"

[task.live-harness-lint]
run = "scripts/with-git-revision.sh timeout 900 cargo clippy --locked -p node --features test-support --test codex_live --test claude_pty_live --test claude_sdk_live -- -D warnings"

# Regenerates the committed protobuf code (crates/wire/src/generated)
# after a proto change. Not a build step: the output is committed, and CI
# fails when it goes stale.
# The iOS check names its targets so it never produces desktop-only packages.
[task.mobile-check]
run = "scripts/with-git-revision.sh timeout 1200 cargo check --locked -p node -p client -p ui-state -p ui-runtime --target aarch64-apple-ios && scripts/with-git-revision.sh timeout 1200 cargo check --locked -p node -p client -p ui-state -p ui-runtime --target aarch64-apple-ios-sim"

# Compile the provider-free production graph used by embedded rich clients.
[task.embedded-check]
run = "scripts/with-git-revision.sh timeout 900 cargo check --locked -p node -p client -p ui-state -p ui-runtime"

# Exercise node's public embedded owner/client boundary. The feature exposes
# fixtures only; the installation under test supplies no provider host.
[task.embedded-test]
run = 'scripts/with-git-revision.sh timeout 900 cargo test --locked -p testnet --test embedding -- "$@"'

[task.protobuf]
run = "scripts/with-git-revision.sh cargo run --locked -p xtask -- codegen"

[task.e2e]
run = 'timeout 900 target/debug/e2e-runner run --amux-binary target/debug/amux --test-agent-binary target/debug/test-agent "$@"'
needs = ["e2e-build"]

[task.e2e-build]
run = "scripts/with-git-revision.sh timeout 900 cargo build --locked -p amux -p e2e-runner -p test-agent --bins"

# This checkout's daemon. A resource: `wt remove` stops it.
[task.daemon]
tied_to = "tree"
name = "{{name_short()}}"
needs = ["build"]
exists = 'test -S "{{root()}}/.wt/amux/amux.sock" && amux profiles >/dev/null 2>&1'
run = "amux server start"
destroy = "amux server stop"
