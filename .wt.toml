# wt owns the tree, its environment, its daemon and the phone lease;
# `just --list` is the task list.

bin = ["target/debug"]
commands = ["amux"]

[env]
AMUX_CONFIG = "{{root()}}/.wt/amux/profile.yaml"
AMUX_LOG = "{{root()}}/.wt/amux/amux.log"
AMUX_INVARIANT_FATAL = "1"

[files.".wt/amux/installation.yaml"]
marker = "#"
content = """
host_name: {{name_short()}}
root: {{root()}}/.wt/amux
front_door_socket: {{root()}}/.wt/amux/amux.sock
keymaps_dir: {{root()}}/.wt/amux/keymaps
prevent_idle_sleep: false
"""

[hooks]
after_new = "python3 scripts/worktree-profile.py {{root()}}/.wt/amux {{name()}} && just build"
warm = "just warm"

# This checkout's daemon. A resource: `wt remove` stops it.
[resource.daemon]
tied_to = "tree"
name = "{{name_short()}}"
exists = 'test -S "{{root()}}/.wt/amux/amux.sock" && amux profiles >/dev/null 2>&1'
create = "amux server start"
destroy = "amux server stop"

# The pinned phone is one device this Mac shares between every checkout, so
# driving it is serialised: a recipe that touches it runs under
# `scripts/with iphone` and waits for the lease. One slot, no instances of
# its own, until the scripts can be pointed at a device per lease.
[resource.iphone]
tied_to = "machine"
count = 1
wait = "45m"
