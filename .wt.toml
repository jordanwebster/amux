# wt coordination. Each checkout — the main one included — runs its own amux instance:
# socket, state, identity and log under `.wt/amux/`, found through
# AMUX_CONFIG, with the checkout's own build first on PATH.

bin = ["target/debug"]
commands = ["amux"]

[env]
AMUX_CONFIG = "${root()}/.wt/amux/config.yaml"
AMUX_LOG = "${root()}/.wt/amux/amux.log"
AMUX_INVARIANT_FATAL = "1"

[files.".wt/amux/config.yaml"]
marker = "#"
content = """
host_name: ${name_short()}
socket_path: ${root()}/.wt/amux/amux.sock
state_path: ${root()}/.wt/amux/state/state.yaml
data_dir: ${root()}/.wt/amux/data
enable_cloud_mode: false
prevent_idle_sleep: false
"""

# The workspace's default-members is amux-cli only; CI covers the whole
# workspace, so these do too.
[task.build]
run = "cargo build --workspace"

[task.test]
run = "scripts/workspace-test.sh"

[task.lint]
run = "cargo clippy --workspace --all-targets --features amux/testnet -- -D warnings"

[task.spec]
run = "scripts/spec-test.sh"

[task.e2e]
run = "timeout 900 cargo run -p e2e-runner -- run"
needs = ["build"]

# This checkout's daemon. A resource: `wt remove` stops it.
[task.daemon]
tied_to = "tree"
name = "${name_short()}"
needs = ["build"]
exists = "amux list >/dev/null 2>&1"
run = "amux server start"
destroy = "amux server stop"
