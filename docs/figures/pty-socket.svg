<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img">
  <title>A local terminal client connects to the agent's pty socket; the agent's hello says where the pty files start and end, then it sends each new end as the terminal writes; the client reads the files from its own cursor and sends keys and resizes. The agent's provider child runs in the PTY; the daemon is not involved.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

      <rect class="box" x="40" y="40" width="160" height="48" rx="4"/><text class="t" x="120" y="60" text-anchor="middle">terminal client</text><text class="s" x="120" y="77" text-anchor="middle">same machine, same user</text>
      <rect class="box" x="380" y="40" width="180" height="48" rx="4"/><text class="t" x="470" y="60" text-anchor="middle">agent process</text><text class="s" x="470" y="77" text-anchor="middle">pty.sock</text>
      <rect class="file" x="640" y="40" width="220" height="48" rx="4"/><text class="a" x="750" y="60" text-anchor="middle">pty/0000000000 …</text><text class="s" x="750" y="77" text-anchor="middle">last K segments retained</text>
      <rect class="box2" x="380" y="150" width="180" height="44" rx="4"/><text x="470" y="177" text-anchor="middle">claude in a PTY</text>

      <path class="arrow" d="M200,56 H380" marker-end="url(#ah)"/>
      <text class="s" x="290" y="48" text-anchor="middle">keys · resize</text>
      <path class="arrow" d="M380,76 H200" marker-end="url(#ah)"/>
      <text class="s" x="290" y="94" text-anchor="middle">hello · each new end</text>
      <path class="arrow-file" d="M560,64 H640" marker-end="url(#ahf)"/>
      <text class="s a" x="600" y="56" text-anchor="middle">append</text>
      <path class="arrow" d="M455,88 V150" marker-end="url(#ah)"/>
      <text class="s" x="447" y="122" text-anchor="end">keys · resize</text>
      <path class="arrow" d="M485,150 V88" marker-end="url(#ah)"/>
      <text class="s" x="493" y="122">bytes</text>
      <path class="arrow-file" d="M120,88 V230 H750 V88" marker-end="url(#ahf)"/>
      <text class="s a" x="435" y="246" text-anchor="middle">reads from its own cursor up to the end; terminal queries in replayed history are dropped</text>
</svg>
