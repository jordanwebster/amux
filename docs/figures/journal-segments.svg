<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img">
  <title>Journal segments are files named by the global byte offset of their first byte. A deleted segment, an ingested segment, and the segment being written are shown, with the daemon's cursor, a slower reader's cursor and the writer position marked as single integers on one global offset line.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

      <rect class="ghost" x="30" y="60" width="200" height="56" rx="4"/>
      <text class="s" x="130" y="84" text-anchor="middle">journal/0000000000</text>
      <text class="s" x="130" y="102" text-anchor="middle">deleted after 2 newer</text>
      <rect class="file" x="250" y="60" width="200" height="56" rx="4"/>
      <text class="a" x="350" y="84" text-anchor="middle">journal/0001048576</text>
      <text class="s" x="350" y="102" text-anchor="middle">closed by the writer</text>
      <rect class="file" x="470" y="60" width="140" height="56" rx="4"/>
      <text class="a" x="540" y="84" text-anchor="middle">journal/0002097152</text>
      <text class="s" x="540" y="102" text-anchor="middle">being appended</text>
      <path class="ghost" d="M610,60 H700 V116 H610"/>
      <text class="s" x="655" y="92" text-anchor="middle">not yet</text>

      <line class="arrow" x1="30" y1="150" x2="720" y2="150" marker-end="url(#ah)"/>
      <text class="s" x="730" y="154">global offset</text>
      <line class="arrow-file" x1="590" y1="116" x2="590" y2="150"/>
      <circle cx="590" cy="150" r="4" fill="#3b82f6"/>
      <text class="a" x="590" y="176" text-anchor="middle">writer 2,650,112</text>
      <line class="arrow" x1="520" y1="116" x2="520" y2="150"/>
      <circle cx="520" cy="150" r="4" fill="#6e7681"/>
      <text x="520" y="196" text-anchor="middle">daemon cursor 2,400,000</text>
      <text class="s" x="30" y="40">one reader state = one integer · a reader at X opens the file whose name is the largest ≤ X</text>
</svg>
