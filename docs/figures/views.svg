<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img">
  <title>The view library is a set of pure functions from the session state to content values; the terminal and the phone each compose the ones they want with their own pane and scroll state; a client may read the state directly</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

  <rect x="20" y="90" width="170" height="120" class="box2"/><text x="105" y="120" text-anchor="middle" class="t">SessionState</text>
  <text x="105" y="142" text-anchor="middle" class="s">AgentState + Transcript + Inputs</text>
  <text x="105" y="158" text-anchor="middle" class="s">pure values</text>
  <rect x="260" y="30" width="230" height="240" class="ghost"/><text x="270" y="50" class="s">ui-view: pure functions</text>
  <rect x="280" y="62" width="190" height="26" class="box"/><text x="375" y="79" text-anchor="middle">fleet_card(fleet, agent)</text>
  <rect x="280" y="94" width="190" height="26" class="box"/><text x="375" y="111" text-anchor="middle">fleet_list(fleet, expand)</text>
  <rect x="280" y="126" width="190" height="26" class="box"/><text x="375" y="143" text-anchor="middle">chat_rows(state, range, opts)</text>
  <rect x="280" y="158" width="190" height="26" class="box"/><text x="375" y="175" text-anchor="middle">ask_card(state)</text>
  <rect x="280" y="190" width="190" height="26" class="box"/><text x="375" y="207" text-anchor="middle">composer_tokens(text, atts)</text>
  <rect x="280" y="222" width="190" height="26" class="box"/><text x="375" y="239" text-anchor="middle">family_header · review_doc</text>
  <path d="M190,150 L260,150" class="arrow" marker-end="url(#ah)"/>
  <rect x="580" y="40" width="300" height="100" class="box"/><text x="730" y="64" text-anchor="middle" class="t">terminal client</text>
  <text x="730" y="86" text-anchor="middle" class="s">composes: fleet_list + chat_rows + ask_card</text>
  <text x="730" y="102" text-anchor="middle" class="s">owns: panes, focus, scroll, raw attach</text>
  <text x="730" y="124" text-anchor="middle" class="s">may read the state directly</text>
  <rect x="580" y="170" width="300" height="100" class="box"/><text x="730" y="194" text-anchor="middle" class="t">phone client</text>
  <text x="730" y="216" text-anchor="middle" class="s">composes: fleet_card + chat_rows_for + ask_card</text>
  <text x="730" y="232" text-anchor="middle" class="s">owns: navigation, sheets, scroll, drafts</text>
  <text x="730" y="254" text-anchor="middle" class="s">view diffs keyed by row id over FFI</text>
  <path d="M490,90 L580,90" class="arrow" marker-end="url(#ah)"/>
  <path d="M490,220 L580,220" class="arrow" marker-end="url(#ah)"/>
  <path d="M190,170 C 400,290 500,290 580,240" class="arrow-dashed" marker-end="url(#ah)"/>
  <text x="380" y="290" text-anchor="middle" class="s">or bypass the views and read the state</text>
</svg>
