<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img">
  <title>Agent process modes: Running once the lock is held; Running to Draining on a graceful stop, an abort or an expired grace timer; Draining to Exiting when the turn ends, an abort cancelling it first; Exiting to exited when the provider exits or is killed ten seconds later. A provider that exits by itself ends the process from Running, and a kill stop ends it from any mode at once.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

      <text class="s" x="40" y="48">start: lock held</text>
      <rect class="box2" x="40" y="60" width="140" height="44" rx="22"/><text class="t" x="110" y="87" text-anchor="middle">Running</text>
      <rect class="box2" x="270" y="60" width="140" height="44" rx="22"/><text class="t" x="340" y="87" text-anchor="middle">Draining</text>
      <rect class="box2" x="500" y="60" width="140" height="44" rx="22"/><text class="t" x="570" y="87" text-anchor="middle">Exiting</text>
      <rect class="box2" x="730" y="60" width="140" height="44" rx="22"/><text class="t" x="800" y="87" text-anchor="middle">exited</text>
      <path class="arrow" d="M180,82 H270" marker-end="url(#ah)"/>
      <text class="s" x="225" y="124" text-anchor="middle">Stop(Graceful|Abort)</text>
      <text class="s" x="225" y="138" text-anchor="middle">or grace timer expired</text>
      <path class="arrow" d="M410,82 H500" marker-end="url(#ah)"/>
      <text class="s" x="455" y="124" text-anchor="middle">turn ended</text>
      <text class="s" x="455" y="138" text-anchor="middle">Abort cancels it first</text>
      <path class="arrow" d="M640,82 H730" marker-end="url(#ah)"/>
      <text class="s" x="685" y="124" text-anchor="middle">provider exited</text>
      <text class="s" x="685" y="138" text-anchor="middle">or killed after 10 s</text>
      <path class="arrow" d="M160,60 V30 H800 V60" marker-end="url(#ah)"/>
      <text class="s" x="455" y="24" text-anchor="middle">the provider exits by itself: its exit is the final boundary</text>
      <path class="arrow-dashed" d="M110,104 V160 H800 V104" marker-end="url(#ah)"/>
      <text class="s" x="455" y="176" text-anchor="middle">Stop(Kill) from any mode: the process group, now, nothing written · Draining and Exiting reject new input</text>
</svg>
