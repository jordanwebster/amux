<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img">
  <title>Three boxes. FleetState is built from the inventory stream: hosts, agent rows with status, families from parent edges. SessionState, one per open chat, holds AgentState from the Snapshot through a thin per-kind layer, the Transcript as a contiguous window of items by order, and Inputs, what this client sent and its verdicts. The Session driver owns the stream, resubscribes and reconnects, pages, sends, and keeps a bounded trace of driver events. Views are pure functions over the two states; the client owns view state.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>


<rect class="box2" x="20" y="20" width="250" height="120" rx="4"/><text class="t" x="145" y="42" text-anchor="middle">FleetState</text><text class="s" x="145" y="68" text-anchor="middle">from SubscribeInventory</text><text class="s" x="145" y="84" text-anchor="middle">hosts · presence · routes</text><text class="s" x="145" y="100" text-anchor="middle">agent rows with phase and working_on</text><text class="s" x="145" y="116" text-anchor="middle">families from parent edges</text><rect class="box2" x="290" y="20" width="420" height="230" rx="4"/><text class="t" x="500" y="42" text-anchor="middle">SessionState (one per open chat)</text><text class="s a" x="500" y="68" text-anchor="middle">AgentState — Snapshot via a thin per-kind layer</text><text class="s" x="500" y="84" text-anchor="middle">phase · open asks · queue · model · mode · working_on</text><text class="s a" x="500" y="110" text-anchor="middle">Transcript — contiguous window by order, key index</text><text class="s" x="500" y="126" text-anchor="middle">[oldest_held, head] · has_older · grows only into the past</text><text class="s a" x="500" y="152" text-anchor="middle">Inputs — what this client sent, and each verdict</text><text class="s" x="500" y="168" text-anchor="middle">sent · queued · settled · rejected · uncertain</text><text class="s" x="500" y="194" text-anchor="middle">update(msg) → Outcome{changed, need_get}</text><text class="s" x="500" y="210" text-anchor="middle">no I/O · never persisted</text><rect class="box" x="750" y="20" width="230" height="230" rx="4"/><text class="t" x="865" y="42" text-anchor="middle">Session driver</text><text class="s" x="865" y="68" text-anchor="middle">owns the stream + Client</text><text class="s" x="865" y="84" text-anchor="middle">open: Snapshot · tail · markers</text><text class="s" x="865" y="100" text-anchor="middle">Lagged → re-tail · Reset → rebuild</text><text class="s" x="865" y="116" text-anchor="middle">EOF → reconnect · catch up</text><text class="s" x="865" y="132" text-anchor="middle">uncertain → resolve at CaughtUp</text><text class="s" x="865" y="148" text-anchor="middle">page_older · send · answer</text><text class="s" x="865" y="164" text-anchor="middle">withdraw · interrupt</text><text class="s" x="865" y="180" text-anchor="middle">trace ring + starting state</text><text class="s" x="865" y="206" text-anchor="middle">→ SessionState.update(msg)</text><path class="arrow" d="M750,145 L712,145" marker-end="url(#ah)"/><rect class="box" x="20" y="290" width="690" height="72" rx="4"/><text class="t" x="365" y="312" text-anchor="middle">views: pure functions over FleetState and SessionState</text><text class="s" x="365" y="334" text-anchor="middle">fleet_list · fleet_card · chat_rows(state, range, opts) · ask_card</text><text class="s" x="365" y="350" text-anchor="middle">composer_tokens · family_header · review_doc</text><rect class="box" x="750" y="290" width="230" height="72" rx="4"/><text class="t" x="865" y="312" text-anchor="middle">client view state</text><text class="s" x="865" y="334" text-anchor="middle">scroll · focus</text><text class="s" x="865" y="350" text-anchor="middle">drafts · expanded</text><path class="arrow" d="M145,140 L145,288" marker-end="url(#ah)"/><path class="arrow" d="M500,250 L500,288" marker-end="url(#ah)"/>
</svg>
