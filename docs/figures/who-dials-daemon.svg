<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img">
  <title>Clients, paired daemons and the pinned processes in an agent directory all talk to the daemon over the same tolerant amux protocol; ctl.sock, the journal and blobs are the daemon-to-agent surfaces</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

  
  <text x="20" y="34" class="s sans">clients of the daemon, any version</text>
  <rect x="20" y="50" width="170" height="40" class="box"/><text x="105" y="75" text-anchor="middle" class="t">TUI</text>
  <rect x="20" y="110" width="170" height="40" class="box"/><text x="105" y="135" text-anchor="middle" class="t">phone runtime</text>
  <rect x="20" y="170" width="170" height="40" class="box"/><text x="105" y="195" text-anchor="middle" class="t">paired daemon</text>
  <rect x="330" y="50" width="200" height="160" class="box2"/>
  <text x="430" y="78" text-anchor="middle" class="t">daemon</text>
  <text x="430" y="104" text-anchor="middle" class="s">store · fan-out</text>
  <text x="430" y="122" text-anchor="middle" class="s">fleet ops · blobs</text>
  <text x="430" y="140" text-anchor="middle" class="s">ingests journals</text>
  <text x="430" y="170" text-anchor="middle" class="s">newest binary</text>
  <rect x="610" y="28" width="270" height="212" class="ghost"/>
  <text x="620" y="46" class="p">agents/&lt;id&gt;/ · one pinned binary</text>
  <rect x="640" y="60" width="210" height="40" class="pin"/><text x="745" y="85" text-anchor="middle" class="t">agent process</text>
  <rect x="640" y="150" width="100" height="40" class="pin"/><text x="690" y="175" text-anchor="middle" class="t">MCP server</text>
  <rect x="750" y="150" width="100" height="40" class="pin"/><text x="800" y="175" text-anchor="middle" class="t">hook binary</text>
  <text x="745" y="222" text-anchor="middle" class="s">harness: claude / codex</text>
  <path d="M690,150 L690,100" class="arrow" marker-end="url(#ah)"/>
  <text x="683" y="129" text-anchor="end" class="s">tools.sock</text>
  <path d="M800,150 L800,100" class="arrow" marker-end="url(#ah)"/>
  <text x="807" y="129" class="s">hooks.sock</text>
  <path d="M190,70 L330,70" class="arrow" marker-end="url(#ah)"/>
  <path d="M190,130 L330,130" class="arrow" marker-end="url(#ah)"/>
  <path d="M190,190 L330,190" class="arrow" marker-end="url(#ah)"/>
  <text x="260" y="248" text-anchor="middle" class="t sans">amux protocol</text>
  <text x="260" y="266" text-anchor="middle" class="s sans">tolerant; version int only</text>
  <text x="260" y="281" text-anchor="middle" class="s sans">for a deliberate break</text>
  <path d="M640,66 L530,66" class="arrow" marker-end="url(#ah)"/>
  <text x="585" y="58" text-anchor="middle" class="s">amux protocol</text>
  <path d="M530,84 L640,84" class="arrow" marker-end="url(#ah)"/>
  <path d="M640,96 L530,96" class="arrow" marker-end="url(#ah)"/>
  <text x="585" y="112" text-anchor="middle" class="s">ctl.sock</text>
  <path d="M640,130 L530,130" class="arrow-file" marker-end="url(#ahf)"/>
  <text x="585" y="146" text-anchor="middle" class="s a">journal</text>
  <text x="585" y="248" text-anchor="middle" class="t sans">same discipline</text>
  <text x="585" y="266" text-anchor="middle" class="s sans">ctl.sock never bumps;</text>
  <text x="585" y="281" text-anchor="middle" class="s sans">the amux protocol almost never</text>
</svg>
