<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" role="img">
  <title>An item moves left to right: provider event, step, append to journal, nudge, daemon reads at its offset, assigns revision and order and commits, fans out, subscription handles forward, client renders. The first three steps are in the agent process, the next four in the daemon.</title>
  <style>
    svg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #6e7681; fill-opacity: 0.06; stroke: #6e7681; stroke-width: 1.2; }
    .box2 { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .pin { fill: #d97706; fill-opacity: 0.12; stroke: #d97706; stroke-width: 1.2; }
    .file { fill: #3b82f6; fill-opacity: 0.10; stroke: #3b82f6; stroke-width: 1.2; }
    .ghost { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.7; }
    .lane { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
    .arrow { fill: none; stroke: #6e7681; stroke-width: 1.3; }
    .arrow-file { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    .arrow-dashed { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note { fill: #059669; fill-opacity: 0.10; stroke: #059669; stroke-width: 1; }
    .bar { fill: #6e7681; fill-opacity: 0.14; stroke: #6e7681; stroke-width: 1.2; }
    .bar-a { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.2; }
    text { font-size: 12px; fill: #6e7681; }
    text.t { font-size: 13px; font-weight: 600; }
    text.s { font-size: 11px; fill: #7d8590; }
    text.a { fill: #3b82f6; }
    text.p { fill: #d97706; }
    text.sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
  </defs>

      <rect class="box2" x="20" y="60" width="100" height="56" rx="4"/><text x="70" y="84" text-anchor="middle">provider</text><text class="s" x="70" y="100" text-anchor="middle">event</text>
      <rect class="box2" x="135" y="60" width="100" height="56" rx="4"/><text x="185" y="84" text-anchor="middle">step</text><text class="s" x="185" y="100" text-anchor="middle">step</text>
      <rect class="file" x="250" y="60" width="100" height="56" rx="4"/><text class="a" x="300" y="84" text-anchor="middle">append</text><text class="s" x="300" y="100" text-anchor="middle">journal/</text>
      <rect class="box2" x="365" y="60" width="100" height="56" rx="4"/><text x="415" y="84" text-anchor="middle">nudge</text><text class="s" x="415" y="100" text-anchor="middle">ctl.sock</text>
      <rect class="file" x="480" y="60" width="100" height="56" rx="4"/><text class="a" x="530" y="84" text-anchor="middle">read</text><text class="s" x="530" y="100" text-anchor="middle">at offset</text>
      <rect class="file" x="595" y="60" width="100" height="56" rx="4"/><text class="a" x="645" y="84" text-anchor="middle">revision + commit</text><text class="s" x="645" y="100" text-anchor="middle">store.sqlite</text>
      <rect class="box2" x="710" y="60" width="100" height="56" rx="4"/><text x="760" y="84" text-anchor="middle">fan-out</text><text class="s" x="760" y="100" text-anchor="middle">handles</text>
      <rect class="box2" x="825" y="60" width="100" height="56" rx="4"/><text x="875" y="84" text-anchor="middle">client</text><text class="s" x="875" y="100" text-anchor="middle">renders</text>
      <path class="arrow" d="M120,88 H135" marker-end="url(#ah)"/>
      <path class="arrow" d="M235,88 H250" marker-end="url(#ah)"/>
      <path class="arrow" d="M350,88 H365" marker-end="url(#ah)"/>
      <path class="arrow" d="M465,88 H480" marker-end="url(#ah)"/>
      <path class="arrow" d="M580,88 H595" marker-end="url(#ah)"/>
      <path class="arrow" d="M695,88 H710" marker-end="url(#ah)"/>
      <path class="arrow" d="M810,88 H825" marker-end="url(#ah)"/>
      <path class="arrow" d="M20,30 H465" />
      <text class="s" x="242" y="22" text-anchor="middle">agent process</text>
      <path class="arrow" d="M480,30 H810" />
      <text class="s" x="645" y="22" text-anchor="middle">daemon</text>
      <path class="arrow" d="M825,30 H925" />
      <text class="s" x="875" y="22" text-anchor="middle">anywhere</text>
      <text class="s" x="20" y="150">daemon absent? steps 1–3 continue, step 4 is dropped harmlessly, steps 5–8 happen when it returns.</text>
      <text class="s" x="20" y="170">commit happens before fan-out, so a client never sees a revision the store can't serve.</text>
</svg>
