[target.'cfg(target_vendor = "apple")']
rustflags = ["-C", "split-debuginfo=packed"]

# The bundled SQLite turns on extensions the store never uses: full-text
# search, R-trees, JSON, statistics tables and loadable extensions. Leaving
# them out takes their code out of every binary, the phone's included.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_SOUNDEX -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION -USQLITE_ENABLE_JSON1 -DSQLITE_OMIT_JSON"
