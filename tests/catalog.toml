[[suite]]
name = "desktop-cli-system"
contract = "The built amux binary hosts agents that outlive a killed daemon and are adopted by the next, attaches terminals to them, serves the cloud relay, writes its login units, routes stop and update through the supervisor, and keeps overlapping releases working across an update."
paths = ["crates/amux/tests"]
recipe = "just test-crate amux -- --bins --test agent_process --test attach --test overlap --test process --test relay --test supervise_cli"
boundary = "System composition"
oracle = "Exact process output, exit status, login-unit goldens, journaled items, process and lock ownership, and the chat read back over the profile socket."
real = ["built amux binary", "processes and process groups", "PTYs", "Unix sockets", "loopback QUIC and TLS", "temporary files"]
substituted = ["providers by the scripted fakes", "cloud account by a stand-in that signs connection tokens"]
time = "real"
capabilities = ["desktop", "Unix", "macOS for the sleep assertion case"]
lane = "system"
evidence = ""
update = "AMUX_UPDATE_GOLDENS=1 just test-crate amux -- --test supervise_cli, then review the login-unit diff."
cargo = [
  { package = "amux", kind = "bin", targets = ["amux"], features = ["bundled"] },
  { package = "amux", targets = ["agent_process", "attach", "overlap", "process", "relay", "supervise_cli"], features = ["bundled"] },
]

