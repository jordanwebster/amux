[package]
name = "tui-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The terminal client over a scripted fake runtime, for trying designs and flows quickly"
publish = false

# No daemon in the graph: the lab relinks in seconds after an edit to the
# terminal client, which is the point of it.
[dependencies]
client = { workspace = true }
shot = { path = "../shot" }
tui = { workspace = true }
ui-runtime = { workspace = true }
ui-state = { workspace = true }
wire = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures-util = { workspace = true }
prost = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shell-words = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "tui-lab"
path = "src/main.rs"
