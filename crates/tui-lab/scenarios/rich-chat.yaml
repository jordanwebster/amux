description: One long headless-Claude chat with every common row kind, a task list, a working-tree diff for the review page, and a scripted reply.
local_host: laptop
cwd: ~/source/amux
open: cache
agents:
  - id: cache
    name: blob cache eviction
    kind: claude_sdk
    ago: 1m
    model: opus
    effort: high
    mode: acceptEdits
    context: { used: 142000, window: 200000 }
    usage:
      state: near
      windows:
        - { name: 5h, used: 81, resets_in: 2h }
        - { name: 7d, used: 44, resets_in: 4d }
    background: 2
    tasks:
      - { subject: Measure the cache's size under the flood, status: done }
      - { subject: Evict least recently used blobs past the cap, status: done }
      - { subject: Cover eviction with a test, status: done }
      - { subject: Document the new parameter, status: active }
    diff: |
      diff --git a/crates/ui-runtime/src/session.rs b/crates/ui-runtime/src/session.rs
      --- a/crates/ui-runtime/src/session.rs
      +++ b/crates/ui-runtime/src/session.rs
      @@ -40,9 +40,14 @@ use crate::trace::DriverTrace;
       /// How many attachment bytes a session keeps before evicting the least
       /// recently used.
      -const BLOB_CACHE: usize = usize::MAX;
      +const BLOB_CACHE: usize = 64 * 1024 * 1024;
      +
      +struct Cached {
      +    bytes: Arc<[u8]>,
      +    used: u64,
      +}

       pub struct Session {
      -    blobs: HashMap<Vec<u8>, Arc<[u8]>>,
      +    blobs: HashMap<Vec<u8>, Cached>,
      +    clock: u64,
       }
      @@ -210,6 +215,21 @@ impl Session {
               self.blobs.get(hash).cloned()
           }
      +
      +    fn evict(&mut self) {
      +        let mut total: usize = self.blobs.values().map(|c| c.bytes.len()).sum();
      +        while total > BLOB_CACHE {
      +            let Some(oldest) = self.blobs.iter().min_by_key(|(_, c)| c.used).map(|(k, _)| k.clone())
      +            else {
      +                break;
      +            };
      +            total -= self.blobs.remove(&oldest).map_or(0, |c| c.bytes.len());
      +        }
      +    }
       }
