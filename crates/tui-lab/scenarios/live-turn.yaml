description: A chat that plays a whole turn live a moment after launch (streaming prose, tool calls, a permission ask mid-turn) so motion and the activity line can be judged.
local_host: laptop
cwd: ~/source/amux
open: live
agents:
  - id: live
    name: docs pass
    kind: claude_sdk
    ago: 30s
    context: { used: 18000 }
    transcript:
      - boundary: started
      - user: Tighten the wording in HOW_IT_WORKS.md; it reads like a spec.
      - say: Sure. I'll start once you're watching.
      - turn: { took: 4s }
timeline:
  - after: 2s
    agent: live
    play:
      - user: Go ahead.
      - think: Reading the page first to see where it drifts into spec voice.
      - read: docs/HOW_IT_WORKS.md
      - read: docs/README.md
      - grep: "MUST|SHALL"
      - say: |
          The page mixes two readers. The first half talks to someone using amux; the pairing section switches
          to protocol detail that belongs in PROTOCOL.md. I'll move that detail out and rewrite the rest in plain
          terms.
      - edit:
          path: docs/HOW_IT_WORKS.md
          old: "A host SHALL present its certificate during the Hello exchange."
          new: "Each machine proves who it is when it connects."
      - edit:
          path: docs/HOW_IT_WORKS.md
          old: "Revocation is propagated via the relay's front door."
          new: "When you remove a device, every other machine stops trusting it within a minute."
      - ask:
          permission:
            tool: Bash
            input: { command: "just docs-check" }
            reason: Checks the docs' links and index.
            then:
              - bash: { command: just docs-check, output: "docs-check passed (47 pages)", exit: 0, took: 3s }
              - say: Moved the protocol detail to PROTOCOL.md and rewrote the pairing section for people using amux. Links check out.
              - turn: {}
