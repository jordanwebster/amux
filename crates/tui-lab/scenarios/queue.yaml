description: An agent part way through a long turn with prompts queued behind it — two of yours, one queued by another agent, and one already being sent into the turn. Type and send while it works to queue more; ctrl+x ends the turn and the queue drains.
local_host: laptop
cwd: ~/source/amux
open: flood
agents:
  - id: flood
    name: flood bench
    kind: claude_sdk
    ago: 1m
    model: opus
    effort: high
    mode: acceptEdits
    context: { used: 96000, window: 200000 }
    queue:
      - Also record the peak for the 300-screenshot run.
      - text: The relay keepalive is merged; rebase onto main before the next run.
        from: relay keepalive
      - Then write the numbers into notes/flood.md.
      - text: Use --release for both builds.
        steer: true
    transcript:
      - boundary: started
      - user: Why does the phone's memory climb when a chat has lots of screenshots?
      - read: crates/ui-runtime/src/session.rs
      - grep: BLOB_CACHE
      - say: |
          The session keeps every attachment's bytes it has fetched, for as long as the chat is open. A chat with hundreds of screenshots holds all of them, so memory grows with the chat rather than with what is on screen.

          A cache with a byte cap would bound it: keep the most recently drawn blobs up to the cap, and fetch the rest again when their rows scroll back into view.

          Three things decide the cap:

          1. The phone's own budget: iOS starts warning a foreground app well before it is killed, and the chat is one of several screens holding images.
          2. How much a screenful needs: a tall chat shows at most a dozen screenshots at once, around 30 MiB at full resolution.
          3. How often rows scroll back: fetching again costs a round trip, so the cap should hold more than one screen.

          64 MiB covers two screens of the heaviest chats with room to spare.
      - turn: { took: 2m }
      - user: Cap it at 64 MiB and measure the phone before and after under a screenshot flood.
      - read: crates/ui-runtime/src/session.rs
      - edit:
          path: crates/ui-runtime/src/session.rs
          old: "    blobs: HashMap<BlobRef, Bytes>,"
          new: "    blobs: BlobCache,"
      - write:
          path: crates/ui-runtime/src/blob_cache.rs
          content: "//! Attachment bytes, least recently used out past a cap.\n"
      - say: The cap is in. Now the flood, before and after, against the same build flags.
      - bash:
          command: scripts/flood --screenshots 600 --report /tmp/flood-blob-cap.json
          running: true
    reply:
      - read: /tmp/flood-blob-cap.json
      - say: "Done: {prompt}"
      - turn: {}
