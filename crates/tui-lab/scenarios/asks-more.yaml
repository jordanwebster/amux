description: The rest of the asks, one agent each — a tool server's form (several fields, and one field), a sign-in link, a Codex access grant, a dialog only Claude's own terminal can answer, and a Codex question with a secret answer.
local_host: laptop
cwd: ~/source/amux
agents:
  - id: form
    name: linear triage
    kind: claude_sdk
    ago: 3m
    transcript:
      - user: File the reconnect flake we found today in Linear.
      - read: notes/flakes.md
      - ask:
          form:
            server: linear
            message: Linear needs a few details before it can create the issue.
            schema:
              type: object
              properties:
                team:
                  type: string
                  title: Team
                  description: The team whose backlog the issue goes in.
                  enum: [FOX, CORE, APPS]
                title:
                  type: string
                  title: Title
                  description: One line, as it will read in the backlog.
                estimate:
                  type: integer
                  title: Estimate
                  description: Points, if you know them.
                urgent:
                  type: boolean
                  title: Urgent
                  description: Pages whoever is on call.
                labels:
                  type: array
                  title: Labels
                  items: { type: string, enum: [bug, flake, client, relay] }
              required: [team, title]
            then:
              - say: Filed it in Linear.
              - turn: {}

  - id: one-field
    name: branch name
    kind: claude_sdk
    ago: 5m
    transcript:
      - user: Open a pull request for the keepalive change.
      - bash: git status --short
      - ask:
          form:
            server: github
            message: GitHub needs a name for the new branch.
            schema:
              type: object
              properties:
                branch:
                  type: string
                  title: Branch
                  description: Lowercase, words joined by hyphens.
              required: [branch]
            then:
              - say: Pushed the branch and opened the pull request.
              - turn: {}

  - id: link
    name: relay errors
    kind: claude_sdk
    ago: 7m
    transcript:
      - user: Check the relay's error rate for the last day.
      - ask:
          link:
            server: grafana
            message: Grafana needs you to sign in before I can read its dashboards.
            url: https://grafana.example.com/login/oauth/authorize?client_id=amux-lab&redirect_uri=https%3A%2F%2Fgrafana.example.com%2Flogin%2Fgeneric_oauth&state=lab-7f3a91
            then:
              - say: The relay's error rate was 0.4% over the last day, all of it during the 03:10 deploy.
              - turn: {}

  - id: grant
    name: cargo cache
    kind: codex
    ago: 9m
    transcript:
      - user: Vendor the dependencies so the build works offline.
      - read: Cargo.toml
      - ask:
          access:
            reason: Vendoring writes the crates into vendor/ and reads them from the cargo registry.
            write: [vendor/]
            read: [~/.cargo/registry]
            network: true
            hosts: [index.crates.io, static.crates.io]
            then:
              - say: Vendored 214 crates into vendor/.
              - turn: {}

  - id: unanswerable
    name: mcp dialog
    kind: claude
    ago: 11m
    transcript:
      - user: Connect to the new tool server and list what it offers.
      - ask:
          unanswerable:
            reason: Claude is showing a form from a tool server that this build can't read. Answer it in Claude's own terminal, or stop the agent.

  - id: secret
    name: deploy token
    kind: codex
    ago: 13m
    transcript:
      - user: Deploy the relay to staging.
      - read: deploy/staging.toml
      - ask:
          question:
            questions:
              - header: Token
                question: Paste the staging deploy token.
                secret: true
              - header: Region
                question: Which region should take the deploy first?
                other: false
                options:
                  - { label: eu-west, description: "Where most phones connect from.", recommended: true }
                  - { label: us-east, description: "The quieter region at this hour." }
            then:
              - say: Deployed to staging, eu-west first.
              - turn: {}
