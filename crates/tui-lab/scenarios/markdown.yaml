description: One headless-Claude chat whose replies use every markdown construct an agent writes (headings, nested and numbered lists, a table, fenced code, quotes, links, long URLs, rules, emphasis) so the chat's markdown can be judged.
local_host: laptop
cwd: ~/source/amux
open: md
agents:
  - id: md
    name: relay retries
    kind: claude_sdk
    ago: 1m
    model: opus
    effort: high
    mode: default
    context: { used: 48000, window: 200000 }
    transcript:
      - boundary: started
      - user: Why does the relay drop idle tunnels, and what should we change?
      - read: crates/relay/src/tunnel.rs
      - read: docs/RELAY.md
      - grep: IDLE_TIMEOUT
      - say: |
          ## What happens

          The relay closes a tunnel after **90 seconds** without traffic. Nothing in the client sends keepalives, so a quiet chat looks *exactly* like a dead one. The timeout lives in `crates/relay/src/tunnel.rs`:

          ```rust
          /// A tunnel with no frames for this long is closed.
          const IDLE_TIMEOUT: Duration = Duration::from_secs(90);

          if last_frame.elapsed() > IDLE_TIMEOUT {
              tunnel.close(Reason::Idle).await;
          }
          ```

          ### Why it shows up now

          1. The phone backgrounds the app and stops reading.
          2. The daemon has nothing to send while the agent waits.
             - Asks are the worst case: the agent is blocked on *you*.
             - Long tool calls are next, since no rows stream while they run.
          3. The relay sees silence and closes the tunnel.

          > The relay is doing what [RELAY.md](docs/RELAY.md) says it should. The gap is that nobody keeps the tunnel warm.

          ---

          ### Options

          | Option | Cost | Risk |
          |---|---|---|
          | Client keepalive every 30s | One tiny frame per tunnel | Wakes phones in the background |
          | Daemon keepalive every 30s | Same, from the other end | None found |
          | Raise the timeout to 10m | Nothing | Dead tunnels linger |

          I'd go with the **daemon keepalive**: it needs no client release and keeps the relay's rule intact. See https://github.com/foxred-software/amux/blob/main/crates/relay/src/tunnel.rs#L40-L58 for where it would hook in.

          - [x] Reproduced the drop with a 2-minute idle chat
          - [ ] Keepalive in the daemon
          - [ ] A test that idles past the timeout
      - turn: { took: 2m }
timeline:
  - after: 1s
    agent: md
    play:
      - user: Compare the options side by side, and list the crates the keepalive touches.
  - after: 1s
    agent: md
    play:
      - stream: "Here is how the options compare:\n\n| Option | What changes | Latency | Risk |\n|---|---|--:|---|\n| Client keepalive | A ping frame every 30s from `ui-runtime`'s pump | 0 ms | Wakes phones in the background, which costs battery on every idle chat |\n"
  - after: 1s
    agent: md
    play:
      - stream: "| Daemon keepalive | The same frame from the host's `relay_client` | 0 ms | None found |\n"
  - after: 1s
    agent: md
    play:
      - stream: "| Raise the timeout | `IDLE_TIMEOUT` goes from 90s to 10m | 0 ms | Dead tunnels linger for up to ten minutes before the relay notices |\n| **Do nothing** | — | n/a | The phone keeps dropping chats that wait on an ask |\n\nThe daemon keepalive wins: no client release, no battery cost.\n\n"
  - after: 1s
    agent: md
    play:
      - stream: "The crates it touches:\n\n| Crate | Owner | Lines | Tests | Coverage | Unsafe | Deps | MSRV | Last release | Platforms | Notes |\n"
  - after: 1s
    agent: md
    play:
      - stream: "|---|---|--:|--:|--:|--:|--:|---|---|---|---|\n| relay_client | connections team | 4,210 | 118 | 86% lines | none | 14 | 1.85 | 2026-09-28 (v0.7.0) | macOS, Linux, Windows | Owns the tunnel and its reconnect loop |\n| relay | connections team | 6,904 | 203 | 79% lines | none | 22 | 1.85 | 2026-09-28 (v0.7.0) | Linux servers only | Closes idle tunnels after IDLE_TIMEOUT |\n"
  - after: 1s
    agent: md
    play:
      - stream: "| ui-runtime | client platform | 9,588 | 341 | 91% lines | none | 18 | 1.85 | 2026-09-30 (v0.7.1) | macOS, Linux, Windows, iOS | Session pump; would carry the client keepalive |\n| node | host platform | 12,730 | 402 | 83% lines | two blocks | 31 | 1.85 | 2026-09-30 (v0.7.1) | macOS, Linux, Windows | Hosts the daemon keepalive timer |\n| wire | protocol team | 3,120 | 57 | 95% lines | none | 6 | 1.80 | 2026-09-12 (v0.6.4) | everywhere | Gains a Keepalive frame kind |\n"
  - after: 1s
    agent: md
    play:
      - said
      - turn: {}
