description: The composer when something stands in the way, and drafts with attachments. An agent that exited (type and Enter resumes it, or Enter alone); one at its usage limit (sending still works); Claude and Codex agents signed out of their accounts; a draft holding a screenshot and a log; and one holding a pasted panic log, which the sent message shows as text.
local_host: laptop
cwd: ~/source/amux
open: chips
agents:
  - id: gone
    name: relay soak
    kind: claude
    ago: 12m
    model: opus
    exited: crashed
    transcript:
      - boundary: started
      - user: Soak the relay for an hour with 200 idle tunnels.
      - bash: { command: "scripts/soak --tunnels 200 --for 1h", took: 40s }
      - say: The soak is running; I'll report the drop count at the end.
      - turn: { took: 1m }
    reply:
      - say: "Back. {prompt}"
      - turn: {}
  - id: limited
    name: pricing copy
    kind: claude_sdk
    ago: 4m
    model: opus
    usage:
      state: blocked
      windows:
        - { name: 5h, used: 100, resets_in: 2h }
        - { name: 7d, used: 64, resets_in: 3d }
    transcript:
      - boundary: started
      - user: Rewrite the pricing page's FAQ in plain words.
      - say: The FAQ is rewritten; the refund answer now says 14 days up front.
      - turn: { took: 3m }
    reply:
      - say: "Done: {prompt}"
      - turn: {}
  - id: signed-out
    name: docs pass
    kind: claude_sdk
    ago: 30m
    model: opus
    sign_in: { state: signed_out, account: jordan@example.com }
    draft:
      text: Then check the links in docs/RELAY.md.
    transcript:
      - boundary: started
      - user: Tidy the pairing section of TERMINAL.md.
      - say: Tidied; the pairing steps now read in the order you do them.
      - turn: { took: 2m }
  - id: codex-out
    name: upload retries
    kind: codex
    ago: 1h
    model: gpt-5-codex
    sign_in: { state: expired, account: jordan@example.com, message: Your ChatGPT session expired. }
    transcript:
      - boundary: started
      - user: Retry failed uploads with backoff.
      - say: Uploads now retry three times with backoff, and the chip says so while it waits.
      - turn: { took: 5m }
  - id: chips
    name: phone layout
    kind: claude_sdk
    ago: 2m
    model: opus
    draft:
      text: "The composer overflows on the SE; here's the screenshot and the layout log: "
      attach:
        - { name: screenshot.png, size: 245760 }
        - { name: layout.log, size: 18432 }
    transcript:
      - boundary: started
      - user: Why does the composer clip on small phones?
      - say: The composer's minimum height assumes the larger type size; on the SE it runs past the keyboard.
      - turn: { took: 1m }
    reply:
      - say: "Looking at it: {prompt}"
      - turn: {}
  - id: paste
    name: relay panic
    kind: claude_sdk
    ago: 6m
    model: opus
    draft:
      text: "The relay panicked overnight; here's the log: "
      attach:
        - name: pasted-1
          text: |
            2026-10-01T03:12:04Z INFO  relay: tunnel 7f3a opened from studio
            2026-10-01T03:12:04Z INFO  relay: tunnel 7f3b opened from laptop
            2026-10-01T03:14:31Z WARN  relay: tunnel 7f3a quiet for 60s
            2026-10-01T03:15:01Z WARN  relay: tunnel 7f3a quiet for 90s, closing
            2026-10-01T03:15:01Z INFO  relay: tunnel 7f3a closed (idle)
            2026-10-01T03:15:02Z ERROR relay: frame for closed tunnel 7f3a
            thread 'relay-io-3' panicked at crates/relay/src/tunnel.rs:212:9:
            called `Option::unwrap()` on a `None` value
            stack backtrace:
               0: rust_begin_unwind
               1: core::panicking::panic_fmt
               2: core::panicking::panic
               3: core::option::unwrap_failed
               4: relay::tunnel::Tunnel::forward
                         at ./crates/relay/src/tunnel.rs:212:9
               5: relay::tunnel::run::{{closure}}
                         at ./crates/relay/src/tunnel.rs:140:17
               6: tokio::runtime::task::core::Core<T,S>::poll
               7: tokio::runtime::task::harness::Harness<T,S>::poll
            note: Some details are omitted, run with `RUST_BACKTRACE=full` for a verbose backtrace.
            2026-10-01T03:15:02Z ERROR relay: worker relay-io-3 exited; restarting
            2026-10-01T03:15:03Z INFO  relay: worker relay-io-3 started
    transcript:
      - boundary: started
      - user: Watch the relay overnight and tell me if anything breaks.
      - say: I'll check the logs in the morning.
      - turn: { took: 30s }
    reply:
      - say: "The panic is a frame arriving for a tunnel the idle timer already closed."
      - turn: {}
