description: Starting agents. From home, press n; the composer's bottom edge holds what will run it (kind, model, mode), where (folder, worktree) and on which machine. Click an item or press ctrl+s then a letter to change it. Open a chat and press ctrl+a n to start a sibling with that chat's settings.
local_host: laptop
hosts:
  - id: studio
    name: studio
    platform: macos
    via: relay
  - id: desk
    name: desk
    platform: linux
    presence: away
cwd: ~/source/amux
agents:
  - id: relay
    name: relay keepalive
    kind: claude_sdk
    cwd: ~/source/amux
    ago: 5m
    model: opus
    effort: high
    mode: acceptEdits
    transcript:
      - boundary: started
      - user: Keep relay tunnels warm from the daemon.
      - say: The daemon now sends a keepalive frame on quiet tunnels.
      - turn: { took: 6m }
  - id: cloud
    name: pricing api
    kind: codex
    cwd: ~/source/amuxcloud
    ago: 20m
    model: gpt-5-codex
    effort: medium
    transcript:
      - boundary: started
      - user: Add the yearly plan to the pricing endpoint.
      - say: The endpoint lists the yearly plan at ten months' price.
      - turn: { took: 9m }
  - id: app
    name: phone layout
    kind: claude_sdk
    host: studio
    cwd: ~/source/amuxapp
    ago: 1h
    model: sonnet
    transcript:
      - boundary: started
      - user: Fix the composer clipping on small phones.
      - say: The composer now sizes to the smaller type on the SE.
      - turn: { took: 12m }
  - id: notes
    name: release notes
    kind: claude
    host: studio
    cwd: ~/source/marketing
    ago: 3h
    transcript:
      - boundary: started
      - user: Draft the 0.7.2 release notes.
      - say: The draft is in notes/release-0.7.2.md.
      - turn: { took: 3m }
