    name: settings screen
    kind: claude_sdk
    ago: 4m
    transcript:
      - user: Add a settings screen to the terminal client for the relay and the theme.
      - read: crates/tui/src/home.rs
      - read: crates/tui/src/theme.rs
      - ask:
          question:
            questions:
              - header: Layout
                question: How should the settings screen be laid out?
                other: false
                options:
                  - label: Sidebar
                    description: Sections listed on the left, the chosen one on the right.
                    recommended: true
                    preview: |
                      ┌──────────────┬───────────────────────────────┐
                      │ › Relay      │ Relay                         │
                      │   Theme      │                               │
                      │   Keys       │ Address   relay.amux.dev      │
                      │   Accounts   │ Keepalive 30s                 │
                      │              │ Status    connected           │
                      │              │                               │
                      └──────────────┴───────────────────────────────┘
                  - label: Stacked
                    description: One scrolling page, a heading per section.
                    preview: |
                      Relay ─────────────────────────────
                        Address    relay.amux.dev
                        Keepalive  30s
                      Theme ─────────────────────────────
                        Palette    from the terminal
                  - label: Dashboard
                    description: Every section at once as cards, edited in place.
                    preview: |
                      ╭─ Relay ──────────────╮  ╭─ Theme ──────────────╮
                      │ Address              │  │ Palette              │
                      │   relay.amux.dev     │  │   from the terminal  │
                      │ Keepalive            │  │ Contrast             │
                      │   30s                │  │   repaired           │
                      │ Status               │  │ Code colours         │
                      │   connected          │  │   on                 │
                      ╰──────────────────────╯  ╰──────────────────────╯
                      ╭─ Keys ───────────────╮  ╭─ Accounts ───────────╮
                      │ Leader               │  │ Signed in            │
                      │   ctrl+a             │  │   jordan             │
                      │ Overview             │  │ Profiles             │
                      │   ctrl+t             │  │   work, home         │
                      │ Stop                 │  │ Usage                │
                      │   ctrl+x             │  │   41% of 5-hour      │
                      ╰──────────────────────╯  ╰──────────────────────╯
                      ╭─ Hosts ──────────────╮  ╭─ About ──────────────╮
                      │ laptop   this one    │  │ amux 0.7.2           │
                      │ desk     online      │  │ protocol v1          │
                      │ pi       away        │  │                      │
                      ╰──────────────────────╯  ╰──────────────────────╯
              - header: Storage
                question: Where should the settings be stored?
                other: false
                options:
                  - label: TOML file
                    description: Hand-editable, next to the layout file.
                    recommended: true
                    preview: |
                      ```toml
                      # ~/.amux/tui/settings.toml
                      [relay]
                      address = "relay.amux.dev"
                      keepalive = "30s"

                      [theme]
                      palette = "terminal"
                      code_colours = true
                      ```
                  - label: In the daemon
                    description: Shared by every client of this host.
                    preview: |
                      ```rust
                      /// Settings every client of this host shares.
                      pub struct HostSettings {
                          pub relay: RelaySettings,
                          pub theme: ThemeChoice,
                      }

                      impl Daemon {
                          pub async fn settings(&self) -> HostSettings {
                              self.store.settings().await
                          }
                      }
                      ```
            then:
              - say: Building the sidebar layout, with settings in a TOML file.
              - turn: {}
  - id: one-question
    name: release notes
    kind: claude_sdk
    ago: 6m
    transcript:
      - user: Write the release notes for 0.7.2.
      - read: CHANGELOG.md
      - ask:
          question:
            questions:
              - header: Audience
                question: Who are these release notes for?
                options:
                  - { label: People using amux, description: "What changed for them, in their words.", recommended: true }
                  - { label: Contributors, description: "Internals: crates, protocol and test changes." }
            then:
              - say: Writing them for people using amux.
              - turn: {}
  - id: codex-question
    name: retry budget
    kind: codex
    ago: 7m
    transcript:
      - user: Add retries to the blob uploader.
      - read: crates/blobs/src/upload.rs
      - ask:
          question:
            questions:
              - header: Attempts
                question: How many times should an upload try before giving up?
                other: false
                options:
                  - { label: "3", description: "About 15 seconds in all." }
                  - { label: "4", description: "About a minute; resumes from what the server holds.", recommended: true }
                  - { label: "6", description: "Several minutes on a bad connection." }
              - header: Large files
                question: Should uploads over 50 MB retry at all?
                options:
                  - { label: "Yes", description: "The same budget as any upload." }
                  - { label: "No", description: "Fail fast and let the person retry." }
            then:
              - say: Going with that budget.
              - turn: {}
  - id: plan
    name: journal compaction
    kind: claude
    ago: 8m
    mode: plan
    transcript:
      - user: Plan how we'd compact journal segments older than a week.
      - read: docs/JOURNAL_AND_STORE.md
      - grep: segment_bytes
      - ask:
          plan:
            plan: |
              ## Compact old journal segments

              Segments older than a week are almost all superseded revisions: on this
              machine 1.8 GB of journal holds 140 MB of live rows. Compaction rewrites
              them in the background without changing what readers see.

              ### Steps

              1. Add a `Compacted` marker record that names the last order it covers.
                 - Written last, so a crash mid-rewrite leaves the old segments in place.
                 - Readers skip it; only recovery reads it.
              2. A background task rewrites segments older than 7 days into one segment per agent,
                 keeping only the newest revision of each item.
                 - Runs at most once an hour, and never while a turn is streaming.
                 - Throttled to 20 MB/s so the daemon stays responsive.
              3. Readers treat a compacted segment like any other; orders stay dense.
              4. Swap the segment list atomically, then delete the old files.

              ### What changes where

              | Crate | Change | Size |
              |---|---|--:|
              | `journal` | The marker record and the rewrite | ~400 lines |
              | `node` | The hourly task and its throttle | ~120 lines |
              | `store` | Nothing: it reads segments as before | 0 |

              The rewrite keeps the newest revision per key:

              ```rust
              fn compact(segments: &[Segment]) -> Segment {
                  let mut newest: BTreeMap<Key, Record> = BTreeMap::new();
                  for record in segments.iter().flat_map(Segment::records) {
                      newest.insert(record.key.clone(), record);
                  }
                  Segment::from_records(newest.into_values())
              }
              ```

              ### Risks

              - **Disk space during the rewrite**: the new segment exists beside the old
                ones until the swap. Skip compaction when free space is under twice the input.
              - A reader holding an old segment open on Windows blocks its deletion; retry
                on the next pass rather than failing.

              ### Tests

              - A flood fixture compacts to the same rows the store serves.
              - A crash injected before the swap leaves the journal readable.
  - id: form
    name: linear triage
    kind: claude_sdk
    ago: 12m
    transcript:
      - user: File the three bugs we found today in Linear.
      - ask:
          form:
            server: linear
            message: Linear needs a team and a priority for these issues.
            schema:
              type: object
              properties:
                team: { type: string, enum: [FOX, CORE] }
                priority: { type: string, enum: [urgent, high, medium, low] }
              required: [team]
  - id: link
    name: cloud sign-in
    kind: claude_sdk
    ago: 15m
    transcript:
      - user: Check the relay's error rate for the last day.
      - ask:
          link:
            server: grafana
            message: Grafana needs you to sign in before I can read dashboards.
            url: https://grafana.example.com/login?session=lab
  - id: unanswerable
    name: mcp dialog
    kind: claude
    ago: 20m
    transcript:
      - user: Connect to the new tool server and list what it offers.
      - ask:
          unanswerable:
            reason: Claude is showing a form from a tool server this build can't read. Attach to Claude's terminal to answer it, or stop the agent.
