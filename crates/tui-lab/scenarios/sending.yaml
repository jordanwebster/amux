description: Every way a prompt goes, or doesn't. Send to the idle agent and to the busy one (both answer two seconds late, so the prompt shows on its way); try to send to the one whose host is away; send to the one that refuses; and send to the one whose link drops, which waits for its host and then may not have arrived.
local_host: laptop
hosts:
  - id: studio
    name: studio
    platform: macos
    via: relay
    presence: away
  - id: cabin
    name: cabin
    platform: linux
cwd: ~/source/amux
open: idle
agents:
  - id: idle
    name: relay docs
    kind: claude_sdk
    ago: 3m
    model: opus
    mode: default
    send: { delay: 2s }
    transcript:
      - boundary: started
      - user: Is the keepalive section of RELAY.md still right?
      - read: docs/RELAY.md
      - say: It is. The daemon sends a keepalive frame every 30 seconds on a quiet tunnel, and the relay still closes one after 90 seconds of silence.
      - turn: { took: 40s }
    reply:
      - read: docs/RELAY.md
      - say: "Done: {prompt}"
      - turn: {}
  - id: busy
    name: flood bench
    kind: claude_sdk
    ago: 1m
    model: opus
    effort: high
    mode: acceptEdits
    send: { delay: 2s }
    transcript:
      - boundary: started
      - user: Measure the phone's memory under a screenshot flood, before and after the cap.
      - read: crates/ui-runtime/src/session.rs
      - say: Running the flood against the capped build now.
      - bash:
          command: scripts/flood --screenshots 600 --report /tmp/flood-blob-cap.json
          running: true
    reply:
      - say: "Done: {prompt}"
      - turn: {}
  - id: away
    name: theme picker
    kind: claude_sdk
    host: studio
    ago: 20m
    model: opus
    transcript:
      - boundary: started
      - user: Add a light theme to the picker.
      - say: The picker now lists Light beside Dark and System.
      - turn: { took: 4m }
  - id: refuses
    name: release notes
    kind: claude_sdk
    ago: 5m
    model: opus
    send: { reject: draining }
    transcript:
      - boundary: started
      - user: Draft the release notes for 0.7.2.
      - say: The draft is in notes/release-0.7.2.md.
      - turn: { took: 2m }
  - id: flaky
    name: cabin backups
    kind: claude_sdk
    host: cabin
    ago: 8m
    model: opus
    send: { lose: 4s }
    transcript:
      - boundary: started
      - user: Check last night's backup on the cabin box.
      - read: /var/log/backup.log
      - say: Last night's backup finished at 03:12 with no errors.
      - turn: { took: 1m }
