[package]
name = "qualification"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
bundled = ["store/bundled", "testnet/bundled"]
perf = [
    "dep:agent-runtime",
    "dep:crossterm",
    "dep:fold",
    "dep:portable-pty",
    "dep:ratatui",
    "dep:rusqlite",
    "dep:store",
    "dep:tui",
    "tui/fixtures",
]

[lib]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
required-features = ["perf"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
client = { workspace = true }
model = { workspace = true }
node = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
testnet = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ui-runtime = { workspace = true }
ui-state = { workspace = true }
uuid = { workspace = true }

agent-runtime = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
fold = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
store = { workspace = true, optional = true }
tui = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
claude = { workspace = true }
gethostname = { workspace = true }
redaction = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true }

[[test]]
name = "codex_live"
path = "tests/codex_live.rs"
harness = false

[[test]]
name = "claude_pty_live"
path = "tests/claude_pty_live.rs"
harness = false

[[test]]
name = "claude_sdk_live"
path = "tests/claude_sdk_live.rs"
harness = false
