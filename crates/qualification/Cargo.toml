[package]
name = "qualification"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
bundled = ["store/bundled"]
# The release perf binary. The workloads themselves build without it, so
# their smoke runs in the ordinary test lane.
perf = []
# The live provider compatibility lane: real providers under the operator's
# login, run only on request through `just live`.
live = []

[lib]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
required-features = ["perf"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
node = { workspace = true }
provider-fakes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
store = { workspace = true }
testnet = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
wire = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
agent-dir = { workspace = true }
hyper-util = { workspace = true }
interpret = { workspace = true }
prost = { workspace = true }
tempfile = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
ui-state = { workspace = true }
uuid = { workspace = true }

[[test]]
name = "claude_pty_live"
path = "tests/claude_pty_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "claude_sdk_live"
path = "tests/claude_sdk_live.rs"
harness = false
required-features = ["live"]

[[test]]
name = "codex_live"
path = "tests/codex_live.rs"
harness = false
required-features = ["live"]
