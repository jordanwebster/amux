[package]
name = "qualification"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
bundled = ["store/bundled"]
# The release perf binary. The workloads themselves build without it, so
# their smoke runs in the ordinary test lane.
perf = []

[lib]

[[bin]]
name = "perf"
path = "src/bin/perf.rs"
required-features = ["perf"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
node = { workspace = true }
provider-fakes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
store = { workspace = true }
testnet = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
wire = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
