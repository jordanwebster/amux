syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";

// Claude's per-kind bodies: the item and snapshot messages encoded into
// Item.body and Snapshot.body for kinds claude_pty and claude_sdk, the
// inputs each accepts, and the answer body AnswerInput carries for them.

message ClaudeCreateConfig {
  // Extra provider arguments exactly as the person gave them.
  repeated string args = 1;
  optional string model = 2;
  optional string permission_mode = 3;
  optional string effort = 4;
}

// ---------------------------------------------------------------------------
// Claude in a terminal
// ---------------------------------------------------------------------------

message ClaudePtyItem {
  oneof kind {
    Prompt prompt = 1;
    Text message = 2;
    Thinking thinking = 3;
    ToolCall tool = 4;
    Turn turn = 5;
    Compaction compaction = 6;
    CompactSummary compact_summary = 7;
    TaskNotification task = 8;
    Interruption interruption = 9;
    AgentMessage agent_message = 10;
    ApiError api_error = 11;
    Boundary boundary = 12;
    SlashOutput slash = 13;
    Unrecognized unrecognized = 14;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 15;
    // A dialog Claude shows in its own terminal that no hook can answer: an
    // unanswerable ask that is its own row.
    AskItem ask = 16;
  }
}

// The summary a compaction wrote into the transcript; the summary is the
// envelope text.
message CompactSummary {}

// A background task's completion notice injected into the conversation.
message TaskNotification {
  string task_id = 1;
  string status = 2;
  string summary = 3;
}

// "You stopped it."
message Interruption {}

// Phase lives in the Snapshot envelope, once.
message ClaudePtySnapshot {
  reserved 1;
  repeated Ask asks = 2;
  TaskList tasks = 3;
  ContextMeter context = 4;
  optional string model = 5;
  optional string permission_mode = 6;
  // Absent until SessionStart or the first system event names it.
  optional string provider_session = 7;
  UsageLimits usage = 8;
  ToolServerHealth servers = 9;
  SignIn sign_in = 10;
  BackgroundProcesses background_processes = 11;
}

message ClaudePtyInput {
  oneof of {
    PromptInput prompt = 1;
    AnswerInput answer = 2;
    Key key = 3;
    Clear clear = 4;
    Interrupt interrupt = 5;
    WithdrawQueued withdraw = 6;
    SendQueuedNow send_now = 7;
  }
}

// The semantic keymap vocabulary. The agent process maps a key to PTY bytes
// with the keymap resolved for the observed Claude version; raw bytes never
// cross the wire.
message Key {
  KeyName key = 1;
}

enum KeyName {
  KEY_NAME_UNSPECIFIED = 0;
  KEY_NAME_ESCAPE = 1;
  KEY_NAME_ACCEPT = 2;
  KEY_NAME_CYCLE_PERMISSION_MODE = 3;
  KEY_NAME_TOGGLE_THINKING = 4;
  KEY_NAME_UP = 5;
  KEY_NAME_DOWN = 6;
  KEY_NAME_TAB = 7;
}

// ---------------------------------------------------------------------------
// Claude through the SDK
// ---------------------------------------------------------------------------

message ClaudeSdkItem {
  oneof kind {
    Prompt prompt = 1;
    Text message = 2;
    Thinking thinking = 3;
    ToolCall tool = 4;
    Task task = 5;
    Turn turn = 6;
    Status status = 7;
    Boundary boundary = 8;
    AgentMessage agent_message = 9;
    ApiError api_error = 10;
    SlashOutput slash = 11;
    Unrecognized unrecognized = 12;
    ModelSwitch model_switch = 13;
    Compaction compaction = 14;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 15;
    // A tool-server form or link: an ask that is the work.
    AskItem ask = 16;
  }
}

// A subagent or background task the SDK reports with its own progress.
message Task {
  string task_id = 1;
  string description = 2;
  TaskState state = 3;
  uint32 tool_count = 4;
  string last_tool = 5;
  // The key of the tool call that started it.
  string tool_key = 6;
  uint64 tokens = 7;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RUNNING = 1;
  TASK_STATE_COMPLETED = 2;
  TASK_STATE_FAILED = 3;
  TASK_STATE_STOPPED = 4;
}

// A status the SDK reports as an event worth a row; the text is the envelope
// text.
message Status {
  string status = 1;
}

message ClaudeSdkSnapshot {
  reserved 1;
  repeated Ask asks = 2;
  TaskList tasks = 3;
  ContextMeter context = 4;
  optional string model = 5;
  optional string effort = 6;
  optional string permission_mode = 7;
  repeated Task active_tasks = 8;
  UsageLimits usage = 9;
  ToolServerHealth servers = 10;
  SignIn sign_in = 11;
  BackgroundProcesses background_processes = 12;
  // Absent until the init event names it.
  optional string provider_session = 13;
  // What the initialize response offers; empty until it arrives.
  repeated OfferedModel models = 14;
  repeated OfferedCommand commands = 15;
}

message ClaudeSdkInput {
  oneof of {
    PromptInput prompt = 1;
    AnswerInput answer = 2;
    Interrupt interrupt = 3;
    SetPermissionMode mode = 4;
    SetModel model = 5;
    Clear clear = 6;
    WithdrawQueued withdraw = 7;
    SetEffort effort = 8;
    SendQueuedNow send_now = 9;
  }
}

message SetPermissionMode {
  string mode = 1;
}

// ---------------------------------------------------------------------------
// Answers (AnswerInput.body for both Claude kinds)
// ---------------------------------------------------------------------------

message ClaudeAnswer {
  oneof of {
    PermissionAnswer permission = 1;
    QuestionAnswer question = 2;
    PlanAnswer plan = 3;
    FormAnswer form = 4;
    LinkAnswer link = 5;
  }
}

message PermissionAnswer {
  oneof of {
    PermissionAllow allow = 1;
    PermissionDeny deny = 2;
  }
}

message PermissionAllow {
  // A ScopeChoice.index from the ask; absent allows once.
  optional uint32 scope = 1;
}

message PermissionDeny {
  string note = 1;
  bool stop = 2;
}

message PlanAnswer {
  oneof of {
    PlanApprove approve = 1;
    PlanSendBack send_back = 2;
  }
}

message PlanApprove {
  bool auto_accept_edits = 1;
}

message PlanSendBack {
  string note = 1;
}
