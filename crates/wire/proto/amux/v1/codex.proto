syntax = "proto3";

package amux.v1;

import "amux/v1/records.proto";

// Codex's per-kind bodies: the item and snapshot messages encoded into
// Item.body and Snapshot.body for kind codex, the inputs it accepts, and the
// answer body AnswerInput carries for it.

message CodexCreateConfig {
  optional string model = 1;
  reserved 2, 3;
  optional string effort = 4;
  // A permission and a mode the catalogue offers: "read-only", "default",
  // "auto", "full-access"; "default", "plan".
  optional string permission = 6;
  optional string mode = 7;
  // Adopt an existing Codex thread instead of starting a new one.
  optional string resume_thread_id = 5;
}

message CodexItem {
  oneof kind {
    Prompt prompt = 1;
    // The final answer.
    Text message = 2;
    Reasoning reasoning = 3;
    Work work = 4;
    McpStartup mcp_startup = 5;
    Turn turn = 6;
    // A prompt delivered into the running turn; the text is the envelope's.
    Steer steer = 7;
    Boundary boundary = 8;
    AgentMessage agent_message = 9;
    ApiError error = 10;
    ModelSwitch reroute = 11;
    Unrecognized unrecognized = 12;
    // Working notes, marked apart from the final answer.
    Text working_note = 13;
    TurnDiff turn_diff = 14;
    ReviewerVerdict verdict = 15;
    // A question, access grant, tool-server form or link: an ask that is
    // the work.
    AskItem ask = 16;
  }
}

// The summary is kept beside the full text, which is the envelope text.
message Reasoning {
  bool complete = 1;
  repeated string summary = 2;
}

// One unit of Codex work. Streamed command output is the envelope text.
message Work {
  oneof of {
    CommandWork command = 1;
    FileChangeWork file_change = 2;
    McpToolCall mcp = 3;
    WebSearch web_search = 4;
    ImageWork image = 5;
    CollabWork collab = 6;
  }
  ToolState state = 7;
  ToolClass class = 8;
  ToolDecision decision = 9;
  optional int64 ended_at_ms = 10;
}

message CommandWork {
  string command = 1;
  string cwd = 2;
  optional int32 exit_code = 3;
  // Codex's own label for a read, search or listing.
  string action = 4;
  bool background = 5;
  // Output dropped from the front of the item's text: a running command
  // keeps only its newest output, cut at a line boundary.
  uint64 output_dropped_bytes = 6;
}

message FileChangeWork {
  repeated FileChange changes = 1;
}

message FileChange {
  string path = 1;
  FileChangeKind kind = 2;
  string move_to = 3;
  // Unified diff for this file.
  string patch = 4;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_ADD = 1;
  FILE_CHANGE_KIND_DELETE = 2;
  FILE_CHANGE_KIND_UPDATE = 3;
}

message McpToolCall {
  string server = 1;
  string tool = 2;
  bytes arguments_json = 3;
  bytes result_json = 4;
  string error = 5;
}

message WebSearch {
  string query = 1;
}

// A generated or viewed image; the image is the envelope's attachment.
message ImageWork {
  bool generated = 1;
  string path = 2;
}

// A child thread: spawn, message, wait, close.
message CollabWork {
  string tool = 1;
  repeated string thread_ids = 2;
  string prompt = 3;
}

message McpStartup {
  string server = 1;
  ToolServerStatus status = 2;
  string error = 3;
}

// The whole-turn diff Codex reports at turn end.
message TurnDiff {
  string patch = 1;
}

// An automatic reviewer's verdict on an action.
message ReviewerVerdict {
  string decision = 1;
  string risk = 2;
  string rationale = 3;
  string item_key = 4;
}

// Phase lives in the Snapshot envelope, once.
message CodexSnapshot {
  reserved 1;
  repeated CodexAsk asks = 2;
  ContextMeter context = 3;
  optional string model = 4;
  // The running model as a person reads it: the catalogue entry whose value
  // is its id, else its id tidied. Absent while the model is.
  optional string model_name = 19;
  reserved 5, 6;
  // The permission the raw settings below name; absent when they match no
  // name, which reads as custom.
  optional string permission = 20;
  // The mode the collaboration mode names: "default" or "plan"; absent
  // until Codex says, or when it names neither.
  optional string mode = 21;
  // Codex's own settings, absent until Codex says.
  optional string approval_policy = 22;
  optional string sandbox = 23;
  // Who answers approvals: "user", or a reviewer model ("auto_review").
  optional string approvals_reviewer = 24;
  optional string collaboration_mode = 25;
  // Absent while no turn is known to be running.
  optional string active_turn = 7;
  ToolServerHealth servers = 8;
  reserved 9;
  CodexUsage usage = 18;
  SignIn sign_in = 10;
  reserved 11;
  BackgroundJobs background_jobs = 17;
  // Plan steps with status.
  TaskList plan = 12;
  optional string effort = 13;
  // Absent until the thread start response names it.
  optional string thread_id = 14;
  // What it offers is in the catalogue the Snapshot names.
  reserved 15, 16;
}

message CodexAsk {
  // The app-server request id, JSON-encoded as the server sent it.
  string key = 1;
  // The unit of work an approval would let run, or, for an ask that is the
  // work, its own AskItem.
  string item_key = 2;
  oneof body {
    CommandApproval command = 3;
    FileChangeApproval file_change = 4;
    FormAsk mcp_form = 5;
    LinkAsk mcp_link = 6;
    AccessGrant access = 7;
    QuestionAsk question = 8;
    McpToolApproval mcp_tool = 9;
  }
  // The decisions this request offers, in the server's order.
  repeated Decision decisions = 10;
}

message CommandApproval {
  string command = 1;
  string cwd = 2;
  string reason = 3;
  // "Allow similar commands": the exact prefix it would allow.
  repeated string allow_prefix = 4;
  // Hosts a network rule would allow.
  repeated string network_hosts = 5;
}

message FileChangeApproval {
  string reason = 1;
  string grant_root = 2;
  repeated FileChange changes = 3;
}

message McpToolApproval {
  string server = 1;
  string tool = 2;
  bytes arguments_json = 3;
}

message CodexInput {
  reserved 4;
  oneof of {
    PromptInput prompt = 1;
    Approve approve = 2;
    Interrupt interrupt = 3;
    SetPermission permission = 11;
    SetMode mode = 12;
    SetModel model = 5;
    WithdrawQueued withdraw = 6;
    AnswerInput answer = 7;
    SetEffort effort = 8;
    SendQueuedNow send_now = 9;
    RenameThread rename = 10;
  }
}

// The daemon's word that the agent was renamed: Codex's thread takes the
// agent's name, so Codex's own app shows the name amux does.
message RenameThread {
  string name = 1;
}

// Rejected if the request is not open.
message Approve {
  string request_id = 1;
  Decision decision = 2;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_APPROVE = 1;
  DECISION_APPROVE_SESSION = 2;
  DECISION_DENY = 3;
  DECISION_ABORT = 4;
  // Approve and add the ask's allow_prefix rule.
  DECISION_APPROVE_SIMILAR = 5;
  // Approve and add the ask's network rule.
  DECISION_APPROVE_NETWORK = 6;
}

// AnswerInput.body for Codex: questions, tool-server forms and links, and
// access grants.
message CodexAnswer {
  oneof of {
    QuestionAnswer question = 1;
    FormAnswer form = 2;
    LinkAnswer link = 3;
    GrantAnswer grant = 4;
  }
}
