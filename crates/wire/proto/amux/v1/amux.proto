// amux protocol.
//
// This directory is the canonical protobuf source. Generated Rust is
// committed under crates/wire/src/generated/; regenerate with
// `just protobuf` after editing any proto here (CI fails on stale output).
//
// The amux runtime uses gRPC services for application calls. Host-to-host
// links exchange length-prefixed Message values on their control stream and
// carry application channels on separate native streams.
//
// Compatibility: never renumber, never reuse a number, never make a field
// required. PROTOCOL_VERSION (Hello.supported_protocol_versions) is bumped
// only for a deliberate semantic break.

syntax = "proto3";

package amux.v1;

import "amux/v1/agent.proto";
import "amux/v1/claude.proto";
import "amux/v1/codex.proto";
import "amux/v1/records.proto";

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

message Error {
  ErrorCode code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
}

message ErrorDetail {
  // Fully-qualified message name, e.g. "amux.v1.ProtocolVersionMismatch".
  string type = 1;
  // Proto-encoded detail message of the named type.
  bytes value = 2;
}

// The one break-glass error: the peers share no protocol version.
message ProtocolVersionMismatch {
  repeated uint32 supported_protocol_versions = 1;
  repeated uint32 peer_supported_protocol_versions = 2;
}

message BlobMissing {
  bytes hash = 1;
}

message BlobTooLarge {
  uint64 size = 1;
  uint64 max = 2;
}

message DiffUnavailable {
  string message = 1;
}

// ResolveAgent found more than one agent by that name.
message AmbiguousAgentName {
  string name = 1;
  repeated Agent candidates = 2;
}

// A spawn named a host that more than one trusted host answers to.
message AmbiguousHostName {
  string name = 1;
  repeated HostEntry candidates = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_CANCELLED = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_UNAUTHENTICATED = 6;
  ERROR_CODE_FAILED_PRECONDITION = 7;
  ERROR_CODE_ABORTED = 8;
  ERROR_CODE_RESOURCE_EXHAUSTED = 9;
  ERROR_CODE_UNIMPLEMENTED = 10;
  ERROR_CODE_UNAVAILABLE = 11;
  ERROR_CODE_UNREACHABLE = 12;
  ERROR_CODE_INTERNAL = 13;
  ERROR_CODE_PAYMENT_REQUIRED = 14;
  ERROR_CODE_DATA_LOSS = 15;
}

// ---------------------------------------------------------------------------
// Transport setup and control
// ---------------------------------------------------------------------------

// Host-to-host control envelope exchanged on the link's control stream.
message Message {
  reserved 5 to 7;

  oneof body {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    NeighborUp neighbor_up = 3;
    NeighborDown neighbor_down = 4;
    Reauth reauth = 8;
    LinkClose link_close = 9;
  }
}

// The handshake carries the sender's current neighbor snapshot; everything
// after it is a delta (NeighborUp/NeighborDown) by definition.
message Hello {
  repeated uint32 supported_protocol_versions = 1;
  Host host = 2;
  repeated Host neighbors = 3;
  optional string auth_token = 4;
  // 16 random bytes drawn when the sender's runtime starts and kept for its
  // life. A link that arrives carrying a different incarnation than an
  // earlier link from the same host proves that earlier link belongs to a
  // process that no longer exists, however healthy it still looks.
  bytes incarnation = 5;
}

message HelloAck {
  oneof outcome {
    HelloAccepted accepted = 1;
    Error error = 2;
  }
}

message HelloAccepted {
  uint32 protocol_version = 1;
  Host host = 2;
  repeated Host neighbors = 3;
  // The acceptor's incarnation; see `Hello.incarnation`.
  bytes incarnation = 4;
}

// "I have a direct link to this host." Strictly adjacency: a node never
// advertises anything it learned from someone else.
message NeighborUp {
  Host host = 1;
}

// "I lost my last direct link to this host."
message NeighborDown {
  bytes host_id = 1;
  optional string reason = 2;
}

// Written by the opener as the first bytes of every non-control stream. The
// destination is routing information only; the pinned handshake inside the
// stream establishes the caller's authority.
message StreamPreface {
  bytes dst = 1;
}

// A stream reset before acceptance carries one of these refusal reasons.
enum StreamRefusal {
  STREAM_REFUSAL_UNSPECIFIED = 0;
  NO_ROUTE = 1;
  PAYMENT_REQUIRED = 2;
  RATE_LIMITED = 3;
  NOT_ADJACENT = 4;
  SHUTTING_DOWN = 5;
}

// Fire-and-forget credential refresh on the cloud link, sent before the
// current token expires. There is no acknowledgement — the protocol never
// acknowledges housekeeping; it only signals state changes. The receiver's
// only answers are silence (refresh accepted, the link continues) or
// `LinkClose(AUTH_EXPIRED)` (the sender reconnects with a fresh token).
message Reauth {
  string auth_token = 1;
}

message Capabilities {
  repeated string features = 1;
  // The agent kinds this host can run.
  repeated Kind kinds = 2;
}

// "The link is closed now, here's why." No grace period: a receiver treats
// the link as gone the moment this arrives.
message LinkClose {
  LinkCloseReason reason = 1;
  optional Error error = 2;
}

enum LinkCloseReason {
  LINK_CLOSE_REASON_UNSPECIFIED = 0;
  LINK_CLOSE_REASON_USER_SHUTDOWN = 1;
  LINK_CLOSE_REASON_UPDATING = 2;
  reserved 3;
  LINK_CLOSE_REASON_RESTARTING = 4;
  LINK_CLOSE_REASON_AUTH_EXPIRED = 5;
  LINK_CLOSE_REASON_PROTOCOL_ERROR = 6;
  // The peers share no protocol version; the older one needs updating.
  LINK_CLOSE_REASON_VERSION_MISMATCH = 7;
  LINK_CLOSE_REASON_USER_REVOKED = 8;
}

message Host {
  bytes host_id = 1;
  string name = 2;
  string version = 3;
  Capabilities capabilities = 4;
  // What kind of machine this is, in the host's own words: the operating
  // system it runs, as it named itself when it was built. A host that
  // predates this field says nothing rather than guessing.
  optional string platform = 5;
  optional bool signed_in = 6;
}


// ---------------------------------------------------------------------------
// Pairing service
// ---------------------------------------------------------------------------

service PairingService {
  rpc Pair(stream PairMessage) returns (stream PairMessage);
}

message PairMessage {
  oneof body {
    bytes spake2_message = 1;
    bytes key_confirmation = 2;
    bytes sealed_identity = 3;
    PairingError error = 4;
    PairingComplete pairing_complete = 5;
    PairingAbandoned pairing_abandoned = 6;
  }
}

message PairingComplete {}
message PairingAbandoned {}

message PairingError {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    NOT_IN_PAIRING_MODE = 1;
    INVALID_PIN = 2;
    PROTOCOL_VIOLATION = 3;
    TIMEOUT = 4;
    USER_REJECTED = 5;
    SELF_PAIRING = 6;
  }

  Reason reason = 1;
  string detail = 2;
}

message PairingIdentity {
  bytes host_id = 1;
  bytes pubkey = 2;
  string name = 3;
  // Authenticated along with the responder identity by SPAKE2 sealing.
  int64 expires_at_unix_ms = 4;
}


// ---------------------------------------------------------------------------
// Inventory
// ---------------------------------------------------------------------------

// Hosts and agent rows: the current set, CaughtUp, then deltas. A listing is
// this stream read to CaughtUp.
message InventoryEvent {
  oneof of {
    HostEntry host = 1;
    HostRemoved host_removed = 2;
    Agent agent = 3;
    AgentRemoved agent_removed = 4;
    CaughtUp caught_up = 100;
  }
}

// One host set: every trusted host is in every snapshot whatever its
// presence; candidates come and go with discovery. HostRemoved only on
// untrust, or when a candidate disappears.
message HostEntry {
  reserved 3, 6;
  bytes host_id = 1;
  string name = 2;
  optional string version = 4;
  optional Capabilities capabilities = 5;
  // The outcome of the daemon's last failed dial attempt at this host,
  // cleared when a route comes up.
  optional string last_dial_error = 7;
  HostVia via = 8;
  optional bool signed_in = 9;
  // The machine's kind, as it announced itself in the handshake. Unset for a
  // host that has never been adjacent.
  optional string platform = 10;
  // Bumped only after an unclean reboot of that host.
  uint64 generation = 11;
  Trust trust = 12;
  Presence presence = 13;
  // Where discovery found a candidate; what pairing dials.
  repeated string addrs = 14;
  // Set when this host closed its link saying it no longer trusts this
  // machine; cleared when it links to this machine again.
  optional bool revoked = 15;
}

enum Trust {
  TRUST_UNSPECIFIED = 0;
  TRUSTED = 1;
  // Found by discovery, never paired.
  CANDIDATE = 2;
}

enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  ONLINE = 1;
  OFFLINE = 2;
  AWAY = 3;
}

enum HostVia {
  HOST_VIA_UNSPECIFIED = 0;
  HOST_VIA_DIRECT = 1;
  HOST_VIA_RELAY = 2;
  HOST_VIA_SSH = 3;
  reserved 4;
}

message HostRemoved {
  bytes host_id = 1;
}

// The inventory row: lifecycle from the daemon, phase and working_on copied
// from the snapshot envelope, never a snapshot.
message Agent {
  bytes agent_id = 1;
  bytes host_id = 2;
  Kind kind = 3;
  optional string name = 4;
  string cwd = 5;
  optional AgentParent parent = 6;
  int64 created_at_ms = 7;
  Lifecycle lifecycle = 8;
  optional string exit_cause = 9;
  Phase phase = 10;
  optional WorkingOn working_on = 11;
  // The snapshot envelope's at_ms: when the agent last did anything, on the
  // clock of the host where it happened.
  int64 last_activity_ms = 12;
  reserved 13;
  string producer_version = 14;
  uint32 incarnation = 15;
}

// The kind is the interpreter.
enum Kind {
  KIND_UNSPECIFIED = 0;
  CLAUDE_PTY = 1;
  CLAUDE_SDK = 2;
  CODEX = 3;
}

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIVE = 1;
  EXITED = 2;
}

message WorkingOn {
  string text = 1;
  int64 updated_at_ms = 2;
}

message AgentRemoved {
  bytes host_id = 1;
  bytes agent_id = 2;
  optional string reason = 3;
}

// ---------------------------------------------------------------------------
// Client and peer services
// ---------------------------------------------------------------------------

// The whole client-facing surface.
service ClientService {
  rpc SubscribeInventory(Empty) returns (stream InventoryEvent);
  // Fleet-wide name to row: NOT_FOUND, or AmbiguousAgentName with the
  // candidates. Every other call takes an agent id.
  rpc ResolveAgent(ResolveAgentRequest) returns (Agent);
  rpc Subscribe(SubscribeRequest) returns (stream SessionEvent);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Get(GetRequest) returns (Item);
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc RenameAgent(RenameAgentRequest) returns (Agent);
  // A registry operation for the CLI, never a chat control.
  rpc StopAgent(StopAgentRequest) returns (Empty);
  // Spawn the directory again.
  rpc ResumeAgent(ResumeAgentRequest) returns (Agent);
  // Cascades to children.
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  // Also called by the tool server with the agent's identity.
  rpc SendMessage(Envelope) returns (SendMessageResponse);
  // The only put: written into that agent's directory.
  rpc PutBlob(PutBlobRequest) returns (BlobRef);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  // Puts the patch blob on the host and returns the Diff value.
  rpc Diff(DiffRequest) returns (amux.v1.Diff);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  // The one bundle format.
  rpc Dump(DumpRequest) returns (DumpResponse);
}

// Daemon to daemon, over the link's application streams. Replication is a
// daemon being a client of its peer; every request and response is the one
// ClientService uses.
service PeerService {
  rpc SubscribeInventory(Empty) returns (stream InventoryEvent);
  rpc Subscribe(SubscribeRequest) returns (stream SessionEvent);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Get(GetRequest) returns (Item);
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc CreateAgent(CreateAgentRequest) returns (Agent);
  rpc RenameAgent(RenameAgentRequest) returns (Agent);
  rpc StopAgent(StopAgentRequest) returns (Empty);
  rpc ResumeAgent(ResumeAgentRequest) returns (Agent);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  rpc SendMessage(Envelope) returns (SendMessageResponse);
  rpc PutBlob(PutBlobRequest) returns (BlobRef);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
  rpc Diff(DiffRequest) returns (amux.v1.Diff);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
}

message ResolveAgentRequest {
  string name = 1;
}

// Clients send tail; a peer source sends after toward its origin.
message SubscribeRequest {
  bytes agent_id = 1;
  oneof from {
    uint32 tail = 2;
    After after = 3;
  }
}

// The delta if it is at most cap rows, else Reset and a tail of cap.
message After {
  uint64 revision = 1;
  uint32 cap = 2;
}

message SessionEvent {
  oneof of {
    Snapshot snapshot = 1;
    Item item = 2;
    Append append = 3;
    CaughtUp caught_up = 5;
    Lagged lagged = 6;
    Reset reset = 7;
    Detached detached = 8;
  }
}

// "You hold what the origin holds as of now", on every stream. On a session
// stream, the origin's revision replay is complete through: a source stores
// it as its cursor and clients ignore it.
message CaughtUp {
  uint64 revision = 1;
}

// The stream closes after this; the client re-tails.
message Lagged {}

// Forget the transcript; a fresh tail follows, then CaughtUp.
message Reset {}

// The origin is not being followed; rows may be stale.
message Detached {}

message FetchRequest {
  bytes agent_id = 1;
  optional uint64 before_order = 2;
  uint32 limit = 3;
}

// By order, newest first; exhausted means no older history exists.
message FetchResponse {
  repeated Item items = 1;
  bool exhausted = 2;
}

message GetRequest {
  bytes agent_id = 1;
  string key = 2;
}

message SendInputRequest {
  bytes agent_id = 1;
  Input input = 2;
}

message CreateAgentRequest {
  bytes agent_id = 1;
  optional bytes host_id = 2;
  optional string name = 3;
  optional AgentParent parent = 4;
  // The same Input as SendInput, so a first prompt carries attachments.
  optional Input initial_prompt = 5;
  string cwd = 6;
  // Which interpreter: the config arm names only the provider.
  Kind kind = 7;
  // The host as a person names it, resolved against this host and the
  // trusted ones: exact first, then ignoring case. host_id wins when both
  // are set; neither means this host.
  optional string host_name = 8;
  oneof config {
    ClaudeCreateConfig claude = 10;
    CodexCreateConfig codex = 11;
  }
}

message RenameAgentRequest {
  bytes agent_id = 1;
  string name = 2;
}

message StopAgentRequest {
  bytes agent_id = 1;
  StopMode mode = 2;
}

// The composer of an exited chat sends its draft through initial_prompt.
message ResumeAgentRequest {
  bytes agent_id = 1;
  optional Input initial_prompt = 2;
}

message DeleteAgentRequest {
  bytes agent_id = 1;
}

message DeleteAgentResponse {
  repeated Agent removed_children = 1;
  repeated Agent unreachable_children = 2;
}

message SendMessageResponse {
  bytes envelope_id = 1;
}

message PutBlobRequest {
  bytes agent_id = 1;
  string name = 2;
  string mime = 3;
  bytes bytes = 4;
}

message GetBlobRequest {
  bytes agent_id = 1;
  bytes hash = 2;
}

message GetBlobResponse {
  BlobRef blob = 1;
  bytes bytes = 2;
}

message DiffRequest {
  bytes agent_id = 1;
  DiffBase base = 2;
}

// Host-owned discovery; the client chooses a host, never a search root.
message ListRepositoriesRequest {
  optional string query = 1;
  uint32 limit = 2;
  // Absent means the answering host.
  optional bytes host_id = 3;
}

message ListRepositoriesResponse {
  repeated ProjectEntry recent = 1;
  repeated ProjectEntry repositories = 2;
  repeated string roots = 3;
}
message ProjectEntry {
  string path = 1;
  string name = 2;
  optional int64 last_used_unix_ms = 3;
}

// Assembles the host-side parts of a dump bundle into the reports
// directory: the agents' journal tails, store slices and agent parts, all
// redacted.
message DumpRequest {
  // Empty means every agent of the profile.
  repeated bytes agent_ids = 1;
  string reason = 2;
  // Produced on an invariant violation or panic rather than on request.
  bool automatic = 3;
}

message DumpResponse {
  string report_path = 1;
  bytes bundle = 2;
}

// ---------------------------------------------------------------------------
// Installation front door (local Unix socket and in-process only)
// ---------------------------------------------------------------------------

service ProfileService {
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  // Snapshot, CaughtUp, then ordered events; ABORTED requires a fresh watch.
  rpc WatchProfiles(WatchProfilesRequest) returns (stream WatchProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (ProfileInfo);
  rpc BindProfile(BindProfileRequest) returns (ProfileInfo);
  rpc LogoutProfile(ProfileOperation) returns (ProfileInfo);
  rpc PauseProfile(ProfileOperation) returns (ProfileInfo);
  rpc ResumeProfile(ProfileOperation) returns (ProfileInfo);
  rpc RenameProfile(RenameProfileRequest) returns (ProfileInfo);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  rpc StartPairing(ProfileStartPairingRequest) returns (StartPairingResponse);
  rpc GetPairingStatus(ProfilePairingStatusRequest) returns (GetPairingStatusResponse);
  rpc CancelPairing(ProfileOperation) returns (CancelPairingResponse);
  rpc BeginPair(ProfileBeginPairRequest) returns (PendingPairResponse);
  rpc ConfirmPair(ProfilePendingPairRequest) returns (GetPeerResponse);
  rpc AbandonPair(ProfilePendingPairRequest) returns (PairingAbandoned);
  rpc GetDeviceIdentity(ProfileRequest) returns (DeviceIdentity);
  rpc TrustSshPeer(ProfileTrustSshPeerRequest) returns (Empty);
  rpc ListPeers(ProfileRequest) returns (ListPeersResponse);
  rpc GetPeer(ProfileGetPeerRequest) returns (GetPeerResponse);
  rpc Unpair(ProfileUnpairRequest) returns (UnpairResponse);
}

service InstallationService {
  rpc GetInfo(GetInfoRequest) returns (InstallationInfo);
  rpc Shutdown(InstallationShutdownRequest) returns (ShutdownResponse);
}

enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_UNBOUND = 1;
  INTENT_BOUND = 2;
  INTENT_LOGGED_OUT = 3;
  INTENT_PAUSED = 4;
}
enum Observed {
  OBSERVED_UNSPECIFIED = 0;
  OBSERVED_LOCAL = 1;
  OBSERVED_CONNECTING = 2;
  OBSERVED_CONNECTED = 3;
  OBSERVED_RETRYING = 4;
  OBSERVED_AUTHENTICATION_REQUIRED = 5;
  reserved 6;
  // The cloud refused this build as too old for its protocol.
  OBSERVED_VERSION_MISMATCH = 7;
  OBSERVED_STARTUP_FAILED = 8;
}
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_FREE = 1;
  TIER_PRO = 2;
}
enum RelayCarrier {
  RELAY_CARRIER_UNSPECIFIED = 0;
  RELAY_CARRIER_QUIC = 1;
  RELAY_CARRIER_TCP = 2;
}
message ProfileInfo {
  string id = 1;
  string label = 2;
  string email = 3;
  string account_name = 4;
  string socket_path = 5;
  string host_id = 6;
  Intent intent = 7;
  Observed observed = 8;
  uint64 revision = 9;
  string startup_error = 10;
  bool available = 11;
  optional string minimum_version = 12;
  Tier tier = 13;
  RelayCarrier relay_carrier = 14;
}
message ListProfilesRequest {}
message ListProfilesResponse { repeated ProfileInfo profiles = 1; }
message WatchProfilesRequest {}
message WatchProfilesResponse {
  uint64 sequence = 1;
  oneof event {
    ProfileInfo upserted = 2;
    string removed_id = 3;
    CaughtUp caught_up = 4;
  }
}
message CreateProfileRequest { string operation_id = 1; optional string label = 2; }
message ProfileRequest { string profile_id = 1; }
message ProfileOperation { string operation_id = 1; string profile_id = 2; }
message BindProfileRequest {
  string operation_id = 1;
  optional string profile_id = 2;
  string cloud_url = 3;
  string staged_refresh_token = 4;
  bool adopt_non_pristine = 5;
  // The OAuth client the refresh token was issued to; empty is the CLI's.
  // A token refreshes only under the client that obtained it.
  string client_id = 6;
}
message RenameProfileRequest {
  string operation_id = 1;
  string profile_id = 2;
  uint64 expected_revision = 3;
  optional string override_name = 4;
}
message DeleteProfileRequest {
  string operation_id = 1;
  string profile_id = 2;
  uint64 confirm_revision = 3;
}
message DeleteProfileResponse {}
message ProfileStartPairingRequest {
  string operation_id = 1;
  string profile_id = 2;
  StartPairingRequest pairing = 3;
}
message ProfilePairingStatusRequest { string profile_id = 1; }
message ProfileBeginPairRequest {
  string operation_id = 1;
  string profile_id = 2;
  BeginPairRequest pairing = 3;
}
message ProfilePendingPairRequest {
  string operation_id = 1;
  string profile_id = 2;
  PendingPairRequest pairing = 3;
}
message ProfileTrustSshPeerRequest {
  string operation_id = 1;
  string profile_id = 2;
  TrustSshPeerRequest pairing = 3;
}
message ProfileGetPeerRequest { string profile_id = 1; PeerRef peer = 2; }
message ProfileUnpairRequest {
  string operation_id = 1;
  string profile_id = 2;
  PeerRef peer = 3;
  string reason = 4;
}
enum PeerVia {
  PEER_VIA_UNSPECIFIED = 0;
  PEER_VIA_DIRECT = 1;
  PEER_VIA_RELAY = 2;
  PEER_VIA_SSH = 3;
}
message GetInfoRequest {}
message InstallationInfo {
  string version = 1;
  string root = 2;
  string front_door_path = 3;
}
message InstallationShutdownRequest { string operation_id = 1; }

// SSH bootstrap includes the local selector needed for subsequent stdio relays.
message SshPairingIdentity {
  PairingIdentity identity = 1;
  string profile_id = 2;
}

message SshTarget {
  string target = 1;
  string profile_id = 2;
}

message BeginPairRequest {
  bytes host_id = 1;
  oneof secret {
    string pin = 2;
    bytes qr_secret = 3;
  }
  repeated string addrs = 4;
}

message PendingPairResponse {
  bytes token = 1;
  PairingIdentity peer = 2;
  PeerVia via = 3;
}

message PendingPairRequest {
  bytes token = 1;
}

// SSH has already authenticated its peer outside the secret-based pairing
// protocol, so its identity commit remains a separate, SSH-only operation.
message TrustSshPeerRequest {
  PairingIdentity peer = 1;
  SshTarget ssh_target = 2;
}

message PeerRef {
  oneof identifier {
    bytes host_id = 1;
    string name = 2;
  }
}

message PeerReachability {
  oneof kind {
    Empty cloud = 1;
    SshTarget ssh_target = 2;
    DirectReachability direct = 3;
  }
}

message DirectReachability {
  repeated string addrs = 1;
}

message PeerEntry {
  bytes host_id = 1;
  string name = 2;
  bytes pubkey = 3;
  int64 paired_at_unix_ms = 4;
  repeated PeerReachability reachabilities = 5;
}

message GetDeviceIdentityRequest {}
message DeviceIdentity {
  bytes host_id = 1;
  string name = 2;
  bytes pubkey = 3;
}

message ListPeersRequest {}
message ListPeersResponse {
  repeated PeerEntry peers = 1;
}

message GetPeerRequest {
  PeerRef peer = 1;
}
message GetPeerResponse {
  PeerEntry peer = 1;
}

message UnpairRequest {
  PeerRef peer = 1;
  string reason = 2;
}
message UnpairResponse {
  PeerEntry removed_peer = 1;
}

message ShutdownResponse {}

message StartPairingRequest {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    PIN = 1;
    QR = 2;
  }

  Mode mode = 1;
  // Operator-chosen reusable PIN for unattended demos. When set, `mode`
  // must be PIN; the session lasts `ttl_seconds` instead of the one-shot
  // window and is neither consumed by success nor locked out by failures.
  optional DemoPairing demo = 3;
  optional uint64 ttl_seconds = 4;
}

message DemoPairing {
  string pin = 1;
  uint64 ttl_seconds = 2;
}

message StartPairingResponse {
  PairingIdentity identity = 1;
  uint64 ttl_seconds = 2;
  repeated string addrs = 3;
  optional string cloud_url = 4;

  oneof secret {
    string pin = 10;
    bytes qr_secret = 11;
  }
}

message GetPairingStatusRequest {}
message GetPairingStatusResponse {
  bool active = 1;
}

message CancelPairingRequest {}
message CancelPairingResponse {}

// Host-owned discovery; the client chooses a host, never a search root.
