[package]
name = "claude"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
pty = ["dep:bytes", "dep:pty-host", "dep:sha2", "dep:toml"]
test-support = ["dep:replay-support"]

[dependencies]
anyhow.workspace = true
bytes = { workspace = true, optional = true }
chrono = { workspace = true }
futures-core = "0.3"
pty-host = { workspace = true, optional = true }
replay-support = { path = "../replay-support", optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
shell-words.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = { workspace = true, optional = true }
uuid.workspace = true

[[bin]]
name = "claude-hook"
path = "src/bin/claude_hook.rs"

[dev-dependencies]
replay-support = { path = "../replay-support" }
tempfile = { workspace = true }
