name = "claude-2.1"
applies_to = ">=2.1.228, <2.2.0"
verified = []

[intent_programs]
prompt = "prompt"
interrupt = "interrupt"
mode_cycle = "mode_cycle"
permission = "permission_menu"
plan = "plan_menu"
question = "question_form"

[provenance]
recorded_version = "2.1.228"
model = "haiku"
dates = ["2026-08-11", "2026-08-12"]
specs = [
    "prompt_multiline",
    "permission",
    "permission_session",
    "permission_deny_feedback",
    "question_single",
    "question_tabs",
    "question_other_single",
    "question_multi",
    "question_mixed",
    "plan_auto",
    "plan_approve",
    "plan_reject",
    "interrupt",
    "mode_cycle",
]

[keys]
escape = [27]
enter = [13]
tab = [9]
space = [32]
down = [27, 91, 66]
shift_tab = [27, 91, 90]
paste_begin = [27, 91, 50, 48, 48, 126]
paste_end = [27, 91, 50, 48, 49, 126]

[delays]
after_paste = 400
after_toggle = 400
after_move = 300
after_tab = 800
after_editor_open = 800
before_submit = 400
after_review_open = 1000
after_deny = 1500
after_menu_text_open = 800
after_other_save = 600

[menus.permission.entries]
allow_once = 1
allow_scoped = 2
deny = 3

[menus.plan.entries]
approve_auto = 1
approve_manual = 2
request_changes = 3

[verified_shapes.permission_menu]
permission_suggestions = [1]

[programs.prompt]
stability = "stable"
steps = [
    { step = "paste", text = "prompt_text" },
    { step = "delay", delay = "after_paste" },
    { step = "key", key = "enter" },
]

[programs.interrupt]
stability = "stable"
steps = [{ step = "key", key = "escape" }]

[programs.mode_cycle]
stability = "stable"
steps = [{ step = "key", key = "shift_tab" }]

[programs.permission_menu]
stability = "menu"
steps = [
    { step = "digit", digit = { source = "menu_entry", menu = "permission", entry = "allow_once" } },
    { step = "digit", digit = { source = "suggestion" } },
    { step = "digit", digit = { source = "menu_entry", menu = "permission", entry = "deny" } },
    { step = "if", cond = "has_feedback", then = [
        { step = "delay", delay = "after_deny" },
        { step = "paste", text = "deny_feedback" },
        { step = "delay", delay = "after_paste" },
        { step = "key", key = "enter" },
    ] },
]

[programs.plan_menu]
stability = "menu"
steps = [
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "approve_auto" } },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "approve_manual" } },
    { step = "digit", digit = { source = "menu_entry", menu = "plan", entry = "request_changes" } },
    { step = "if", cond = "has_feedback", then = [
        { step = "delay", delay = "after_menu_text_open" },
        { step = "type", text = "plan_feedback" },
        { step = "delay", delay = "before_submit" },
        { step = "key", key = "enter" },
    ] },
]

[programs.question_form]
stability = "menu"
steps = [
    { step = "for_each", over = "questions", steps = [
        { step = "if", cond = "is_first", then = [], otherwise = [
            { step = "delay", delay = "after_tab" },
        ] },
        { step = "if", cond = "multi_select", then = [
            { step = "for_each", over = "selected_options", steps = [
                { step = "move_to", row = "selected_option" },
                { step = "key", key = "space" },
                { step = "delay", delay = "after_toggle" },
            ] },
            { step = "if", cond = "has_other", then = [
                { step = "move_to", row = "other_row" },
                { step = "key", key = "enter" },
                { step = "delay", delay = "after_editor_open" },
                { step = "type", text = "other_text" },
                { step = "delay", delay = "before_submit" },
                { step = "key", key = "enter" },
                { step = "delay", delay = "after_other_save" },
                { step = "key", key = "space" },
                { step = "delay", delay = "after_toggle" },
            ] },
            { step = "key", key = "tab" },
        ], otherwise = [
            { step = "if", cond = "has_other", then = [
                { step = "digit", digit = { source = "other_row" } },
                { step = "delay", delay = "after_editor_open" },
                { step = "type", text = "other_text" },
                { step = "delay", delay = "before_submit" },
                { step = "key", key = "enter" },
            ], otherwise = [
                { step = "for_each", over = "selected_options", steps = [
                    { step = "digit", digit = { source = "selected_option" } },
                ] },
            ] },
        ] },
    ] },
    { step = "if", cond = "single_question_single_select", then = [], otherwise = [
        { step = "if", cond = "last_question_multi", then = [
            { step = "delay", delay = "after_tab" },
            { step = "key", key = "enter" },
            { step = "delay", delay = "after_review_open" },
            { step = "key", key = "enter" },
        ], otherwise = [
            { step = "delay", delay = "after_tab" },
            { step = "key", key = "enter" },
        ] },
    ] },
]
