[package]
name = "node"
version = "0.7.0"
edition.workspace = true
license.workspace = true
description = "The amux daemon: installation, profile runtimes, the agent registry and startup"
publish = false

[dependencies]
agent-dir = { workspace = true }
journal = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
settings = { workspace = true }
store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
wire = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
provider-fakes = { workspace = true }
tempfile = { workspace = true }
