[package]
name = "e2e-runner"
version = "0.1.0"
edition = "2024"
description = "E2E test runner for amux"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
portable-pty = "0.8"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
tempfile = "3"
shell-words = { workspace = true }
