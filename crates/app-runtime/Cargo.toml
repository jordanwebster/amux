[package]
name = "app-runtime"
version = "0.1.0"
edition.workspace = true
description = "Account sessions, presentation projection, fleet cache and the frame-coalesced event queue any rich amux client reuses"
publish = false

[features]
default = ["bundled"]
bundled = ["store/bundled"]
# Writes remembered states into a store so a driving build can open them.
debug-tools = []

[dependencies]
artifacts = { workspace = true }
client = { workspace = true }
model = { workspace = true }
store = { workspace = true }
ui-runtime = { workspace = true }
ui-state = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
