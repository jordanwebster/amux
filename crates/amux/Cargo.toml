[package]
name = "amux"
version = "0.6.0"
edition.workspace = true
description = "Agent multiplexer - library for building amux clients and servers"

[features]
default = ["local-agents"]
# Local agent hosting: provider-backed Claude/test-agent PTY sessions and the Codex app-server client
# (`codex`, which brings its WebSocket stack). Default-on for the desktop daemon;
# embedded mobile clients build with `default-features = false`. The daemonish
# behaviors (direct reachability, self-update poll) are NOT gated here — they
# are a runtime builder/config choice, independent of this feature.
local-agents = ["claude/pty", "dep:pty-host", "dep:codex"]
# Compiles the in-process spec-test harness (`amux::testnet`) into the
# library. Test-only; never enable in production builds.
testnet = ["dep:tempfile", "local-agents"]

[dependencies]
anyhow = { workspace = true }
claude = { workspace = true }
tempfile = { workspace = true, optional = true }
pty-host = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
gethostname = { workspace = true }
oauth2 = { workspace = true }
async-trait = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pemfile = { workspace = true }
ring = { workspace = true }
curve25519-dalek = { workspace = true }
rcgen = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
socket2 = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
shell-words = { workspace = true }

[target.'cfg(unix)'.dependencies]
codex = { path = "../codex", optional = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
prost-types = { workspace = true }
amux-ui = { workspace = true }
codex = { path = "../codex", features = ["specs"] }
replay-support = { path = "../replay-support" }
tokio-tungstenite = { workspace = true }
nix = { workspace = true }

[[test]]
name = "spec"
path = "tests/spec/main.rs"
required-features = ["testnet"]

# Opt-in real-Claude capture harness (the seed of the CHAT.md §H suite).
# Does nothing unless scenarios are named: see tests/capture/main.rs.
[[test]]
name = "capture"
path = "tests/capture/main.rs"
harness = false

# Maintained opt-in real-Codex backend suite. With no arguments it prints usage
# and exits without live work; see tests/codex_live.rs.
[[test]]
name = "codex_live"
path = "tests/codex_live.rs"
harness = false

[build-dependencies]
prost-build = { workspace = true }
tonic-prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
