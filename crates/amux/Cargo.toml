[package]
name = "amux"
version = "0.3.0"
edition.workspace = true
description = "Agent multiplexer - library for building amux clients and servers"

[features]
default = ["local-agents"]
# Desktop/local agent runtime. This owns PTY-backed Claude/test-agent process
# spawning and is intentionally absent from embedded mobile client builds.
local-agents = ["dep:portable-pty"]
# Marker for client-only embedded builds. Use with `default-features = false`.
client-only = []
# Compiles the in-process spec-test harness (`amux::testnet`) into the
# library. Test-only; never enable in production builds.
testnet = ["dep:tempfile", "local-agents"]

[dependencies]
anyhow = { workspace = true }
tempfile = { workspace = true, optional = true }
portable-pty = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
futures-util = { workspace = true }
gethostname = { workspace = true }
oauth2 = { workspace = true }
async-trait = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pemfile = { workspace = true }
ring = { workspace = true }
curve25519-dalek = { workspace = true }
rcgen = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
fs2 = { workspace = true }
socket2 = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
prost-types = { workspace = true }

[[test]]
name = "spec"
path = "tests/spec/main.rs"
required-features = ["testnet"]

[build-dependencies]
prost-build = { workspace = true }
tonic-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
