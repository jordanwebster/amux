syntax = "proto3";

package amux.v1;

import "amux/v1/claude.proto";

// Dev/test-only agent creation config and echo protocol payloads.
message TestAgentCreateConfig {
  string command = 1;
  optional TerminalSize initial_terminal_size = 2;
  string working_dir = 3;
}

message TestEchoV1Args {}

message TestEchoV1Input {
  bytes payload = 1;
}

message TestEchoV1Output {
  bytes payload = 1;
}
