// amux protocol vNext.
//
// This file is the canonical protobuf source. Generated Rust types live in
// crates/amux/src/protocol/wire/generated.rs and must be wrapped in domain
// types from crates/amux/src/protocol/types/ before being used by application
// code.
//
// The amux runtime owns connection setup, frame routing, multiplexing,
// authorization, and dispatch. This is not a gRPC commitment.
//
// Service return types describe successful payloads. Endpoint-delivered calls
// are carried by FrameBody and normally end with Response:
//   - Response.payload contains the encoded successful return message
//   - Response.error contains the call failure
//   - Cancel requests cancellation; the receiver normally ends the call with
//     Response.error(ERROR_CODE_CANCELLED).
//
// Routed calls may also end before service delivery with a relay-generated
// RoutingError. Endpoints map RoutingError to local call failure, usually
// ERROR_CODE_UNREACHABLE.
//
// Method scopes are part of the protocol contract:
//   - LOCAL  methods must arrive in LocalFrame from a trusted local connection
//   - PEER   methods must arrive in PeerFrame from an adjacent peer
//   - ROUTED methods must arrive in RoutedFrame and may cross hops
//
// The dispatcher enforces method scope, the frame type enforces provenance,
// and routed frames also validate src.peek() == ctx.link.

syntax = "proto3";

package amux.v1;

// ---------------------------------------------------------------------------
// Common
// ---------------------------------------------------------------------------

message Empty {}

// In-band marker that a routing snapshot has been flushed.
message SnapshotComplete {}

// In-band marker that a session replay has been flushed.
message ReplayComplete {
  // Opaque position at the replay boundary when the io_protocol has one.
  optional bytes cursor = 1;
}

message Route {
  // Ordered stack of link names. For dst, links[0] is the next hop.
  repeated string links = 1;
}

message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
}

message ErrorDetail {
  // Fully-qualified message name, e.g. "amux.v1.UpdateRequired".
  string type = 1;
  // Proto-encoded detail message of the named type.
  bytes value = 2;
}

message UpdateRequired {
  string minimum_version = 1;
  string current_version = 2;
  optional string update_url = 3;
}

message ProtocolVersionMismatch {
  repeated uint32 supported_protocol_versions = 1;
  repeated uint32 peer_supported_protocol_versions = 2;
}

message InvalidLinkName {
  string name = 1;
  string reason = 2;
}

message DuplicateCall {
  Route route = 1;
  bytes call_id = 2;
  string method = 3;
}

message SequenceNumberMismatch {
  uint64 expected = 1;
  uint64 actual = 2;
}

message AmbiguousAgentName {
  string name = 1;
  repeated bytes agent_ids = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_CANCELLED = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_UNAUTHENTICATED = 6;
  ERROR_CODE_FAILED_PRECONDITION = 7;
  ERROR_CODE_ABORTED = 8;
  ERROR_CODE_RESOURCE_EXHAUSTED = 9;
  ERROR_CODE_UNIMPLEMENTED = 10;
  ERROR_CODE_UNAVAILABLE = 11;
  ERROR_CODE_UNREACHABLE = 12;
  ERROR_CODE_INTERNAL = 13;
}

// ---------------------------------------------------------------------------
// Transport setup and control
// ---------------------------------------------------------------------------

// Sent once by the connecting side before TransportMessage framing begins.
message ConnectRequest {
  // Wire-format compatibility. The listener picks one supported version and
  // returns it in ConnectAccepted, or rejects the connection.
  repeated uint32 supported_protocol_versions = 1;

  // Hint for the link name. The listener returns the final assigned name
  // in ConnectAccepted.assigned_link_name and may override this.
  string proposed_link_name = 2;

  optional ClientInfo client = 3;

  // Usually a JWT.
  optional string auth_token = 4;

  Capabilities capabilities = 5;
}

message ConnectResponse {
  oneof outcome {
    ConnectAccepted accepted = 1;
    Error error = 2;
  }
}

message ConnectAccepted {
  uint32 protocol_version = 1;

  // Link name assigned by the listener for this direct connection.
  string assigned_link_name = 2;

  // Absence disables heartbeat. idle_timeout_ms = 0 is invalid.
  optional HeartbeatConfig heartbeat = 3;
  Capabilities capabilities = 4;
}

message HeartbeatConfig {
  // From the receiver's perspective: HEARTBEAT_ROLE_DIALER means the receiver sends Ping.
  HeartbeatRole role = 1;
  uint32 idle_timeout_ms = 2;
}

enum HeartbeatRole {
  HEARTBEAT_ROLE_UNSPECIFIED = 0;
  HEARTBEAT_ROLE_DIALER = 1;
  HEARTBEAT_ROLE_RESPONDER = 2;
}

message ClientInfo {
  string name = 1;
  string version = 2;
}

message Capabilities {
  repeated string features = 1;
}

// Top-level message exchanged after a successful handshake.
message TransportMessage {
  oneof message {
    LocalFrame local = 1;
    PeerFrame peer = 2;
    RoutedFrame routed = 3;

    // Transport-control messages are hop-local. They are never routed.
    Ping ping = 10;
    Pong pong = 11;
    ReauthRequest reauth = 12;
    ReauthResponse reauth_response = 13;
    GoAway goaway = 14;
  }
}

message Ping {}
message Pong {}

message ReauthRequest {
  string auth_token = 1;
}

message ReauthResponse {
  oneof outcome {
    Empty accepted = 1;
    Error error = 2;
  }
}

message GoAway {
  GoAwayReason reason = 1;
  optional Error error = 2;
  uint32 drain_timeout_ms = 3;
}

enum GoAwayReason {
  GO_AWAY_REASON_UNSPECIFIED = 0;
  GO_AWAY_REASON_USER_SHUTDOWN = 1;
  GO_AWAY_REASON_UPDATING = 2;
  GO_AWAY_REASON_SUSPENDING = 3;
  GO_AWAY_REASON_RESTARTING = 4;
  GO_AWAY_REASON_AUTH_EXPIRED = 5;
  GO_AWAY_REASON_PROTOCOL_ERROR = 6;
  GO_AWAY_REASON_UPDATE_REQUIRED = 7;
}

// ---------------------------------------------------------------------------
// Frames and multiplexing
// ---------------------------------------------------------------------------

message LocalFrame {
  // 16-byte non-zero call id. Valid only on trusted local connections.
  bytes call_id = 1;
  FrameBody body = 2;
}

message PeerFrame {
  // 16-byte non-zero call id. PeerFrame has no routes by construction.
  bytes call_id = 1;
  FrameBody body = 2;
}

message RoutedFrame {
  Route src = 1;
  Route dst = 2;

  // 16-byte non-zero call id. Relays preserve this value exactly.
  bytes call_id = 3;

  oneof message {
    // Opaque routed payload. Endpoint decode decides whether this is an
    // encoded FrameBody, encrypted bytes, or a future routed body encoding.
    bytes payload = 10;
    RoutingError routing_error = 11;
  }
}

// Routing-layer failure generated by a relay before the call reaches the
// service. Terminal for the routed call_id. Services never receive or emit
// RoutingError.
//
// `failed_route` is the original counterparty route the call was destined
// for, reconstructed by the relay at the failure point as
// `reverse(src) + missing_next_hop + remaining_dst_after_pop`. Endpoints can
// include it in surfaced error messages and use it for defense-in-depth
// matching alongside `call_id` (against a peer that knows a `call_id` but
// not the original target route).
message RoutingError {
  Error error = 1;
  Route failed_route = 2;
}

message FrameBody {
  oneof kind {
    Request request = 1;
    Response response = 2;
    StreamItem stream_item = 3;
    Cancel cancel = 4;
  }
}

message Request {
  // Fully-qualified RPC name, e.g. "/amux.v1.AgentService/CreateAgent".
  string method = 1;

  // Proto-encoded request message. For streaming methods this is encoded
  // Empty; stream values follow as StreamItem.payload.
  bytes payload = 2;
}

message Response {
  oneof outcome {
    bytes payload = 1;
    Error error = 2;
  }
}

message StreamItem {
  bytes payload = 1;
}

// Generic caller-initiated cancellation for the active call_id.
message Cancel {}

// ---------------------------------------------------------------------------
// Routing service
// ---------------------------------------------------------------------------

service RoutingService {
  // PEER-scoped. Host routes are hop-relative; receivers rewrite inbound
  // routes using the link the event arrived on before storing or
  // rebroadcasting. Host events that make an agent routable must precede
  // that agent's AgentUp/AgentUpdated. Initial snapshot order is
  // hosts, agents, then SnapshotComplete.
  rpc SubscribeRoutingEvents(SubscribeRoutingEventsRequest) returns (stream SubscribeRoutingEventsResponse);
}

message SubscribeRoutingEventsRequest {}

message SubscribeRoutingEventsResponse {
  oneof event {
    HostUp host_up = 10;
    HostDown host_down = 12;

    AgentUp agent_up = 20;
    AgentUpdated agent_updated = 21;
    AgentDown agent_down = 22;

    SnapshotComplete snapshot_complete = 100;
  }
}

message Host {
  bytes host_id = 1;
  string name = 2;
  string version = 3;
}

message HostUp {
  Host host = 1;
  Route route = 2;
}
message HostDown {
  bytes host_id = 1;
  Route route = 2;
  optional string reason = 3;
}

message Agent {
  bytes agent_id = 1;
  bytes host_id = 2;
  optional string name = 3;
  string command = 4;
  string working_dir = 5;
  string agent_type = 6;
  repeated string io_protocols = 7;
  bool readonly = 8;
  repeated string args = 9;
  int64 created_at_unix_ms = 10;
}

message AgentUp {
  Agent agent = 1;
}
message AgentUpdated {
  Agent agent = 1;
}
message AgentDown {
  bytes agent_id = 1;
  optional string reason = 2;
}

// ---------------------------------------------------------------------------
// Agent service
// ---------------------------------------------------------------------------

service AgentService {
  // LOCAL-scoped.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ResolveAgent(ResolveAgentRequest) returns (ResolveAgentResponse);

  // ROUTED-scoped. Empty dst means "the receiving host".
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc RenameAgent(RenameAgentRequest) returns (RenameAgentResponse);
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);

  // ROUTED-scoped. First client StreamItem must be SessionOpen.
  rpc OpenSession(stream OpenSessionRequest) returns (stream OpenSessionResponse);
}

message AgentEntry {
  Agent agent = 1;
  Route route = 2;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentEntry agents = 1;
}

message ResolveAgentRequest {
  oneof identifier {
    bytes agent_id = 1;
    string agent_name = 2;
  }
}
message ResolveAgentResponse {
  AgentEntry agent = 1;
}

message CreateAgentRequest {
  bytes agent_id = 1;
  optional string name = 2;

  oneof agent {
    ClaudeCreateConfig claude = 10;
    // Dev/test only. Production servers MUST reject this with UNIMPLEMENTED.
    TestAgentCreateConfig test_agent = 100;
  }
}

message ClaudeCreateConfig {
  string working_dir = 1;
  repeated string args = 2;
  oneof runtime {
    ClaudePtyRuntime pty = 10;
    ClaudeSdkRuntime sdk = 11;
  }
}

message ClaudePtyRuntime {
  optional TerminalSize initial_terminal_size = 1;
}

message ClaudeSdkRuntime {}

message TestAgentCreateConfig {
  string command = 1;
  optional TerminalSize initial_terminal_size = 2;
  string working_dir = 3;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message RenameAgentRequest {
  bytes agent_id = 1;
  string name = 2;
}
message RenameAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  bytes agent_id = 1;
}

message DeleteAgentResponse {}

// ---------------------------------------------------------------------------
// Sessions
// ---------------------------------------------------------------------------

message OpenSessionRequest {
  oneof event {
    SessionOpen open = 1;
    SessionInput input = 2;
    SessionControl control = 3;
  }
}

message SessionOpen {
  bytes agent_id = 1;
  string io_protocol = 2;
  // Opaque arguments. The selected io_protocol defines the contents.
  optional bytes args = 3;
}

message SessionInput {
  // Client-generated id for correlating protocol-defined input results.
  bytes input_id = 1;
  // Opaque input payload. The selected io_protocol defines the contents.
  bytes payload = 2;
}

// Side-channel control event (resize, focus, etc.). Distinct from
// `SessionInput` because it isn't data flowing through the agent's I/O -
// it's a directive about the session itself. Vocabulary is io_protocol-defined.
message SessionControl {
  bytes payload = 1;
}

message OpenSessionResponse {
  oneof event {
    SessionOpened opened = 1;
    SessionOutput output = 2;
    SessionInputResult input_result = 3;
    ReplayComplete replay_complete = 4;
  }
}

message SessionOpened {}

message SessionOutput {
  // Opaque output payload. The selected io_protocol defines the contents.
  bytes payload = 1;
}

message SessionInputResult {
  // Echoes SessionInput.input_id when the selected io_protocol reports
  // per-input acceptance or rejection. Not all io_protocols emit input results.
  bytes input_id = 1;
  oneof outcome {
    Empty accepted = 2;
    Error error = 3;
  }
}

// ---------------------------------------------------------------------------
// First-party io_protocol payloads
// ---------------------------------------------------------------------------

// `claude_raw_v1` - opaque PTY bytes. Input payload is bytes-to-stdin;
// output payload is bytes-from-stdout. Replay is the retained byte buffer.
message ClaudeRawV1Args {
  optional TerminalSize terminal_size = 1;
  optional ClaudeRawV1ReplayQuery replay_query = 2;
}

message ClaudeRawV1ReplayQuery {
  oneof query {
    uint64 tail_bytes = 1;
  }
}

message ClaudeRawV1Control {
  oneof control {
    TerminalSize resize = 1;
  }
}

// `claude_pty_transcript_v1` - structured transcript stream with sequence
// ids. Input is action-structured (`write` / `delay_ms`).
message ClaudePtyTranscriptV1Args {
  optional TerminalSize terminal_size = 1;
  optional ClaudePtyTranscriptV1ReplayQuery replay_query = 2;
}

message ClaudePtyTranscriptV1ReplayQuery {
  oneof query {
    uint64 since = 1;
    uint64 tail_count = 2;
  }
}

message ClaudePtyTranscriptV1Cursor {
  uint64 seq_id = 1;
}

message ClaudePtyTranscriptV1Input {
  // Concurrency precondition: the sequence the client observed before
  // composing this input. Not a correlation id.
  uint64 expected_seq = 1;
  repeated ClaudePtyTranscriptV1Action actions = 2;
}

message ClaudePtyTranscriptV1Action {
  oneof action {
    bytes write = 1;
    uint32 delay_ms = 2;
  }
}

message ClaudePtyTranscriptV1Output {
  uint64 seq_id = 1;
  // JSON-encoded Claude transcript row.
  bytes payload = 2;
}

// `test_echo_v1` - test-only io_protocol. No args, no controls; input
// payload bytes are echoed back verbatim as output payload bytes.

// ---------------------------------------------------------------------------
// Hook and admin
// ---------------------------------------------------------------------------

service HookService {
  // LOCAL-scoped.
  rpc HandleHook(HandleHookRequest) returns (HandleHookResponse);
}

message HandleHookRequest {
  bytes agent_id = 1;
  HookProvider provider = 2;
  bytes payload = 3;
  bool external = 4;
}

message HandleHookResponse {}

enum HookProvider {
  HOOK_PROVIDER_UNSPECIFIED = 0;
  HOOK_PROVIDER_CLAUDE = 1;
}

service AdminService {
  // LOCAL-scoped.
  rpc Debug(DebugRequest) returns (DebugResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc Suspend(SuspendRequest) returns (SuspendResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc ConnectToServer(ConnectToServerRequest) returns (ConnectToServerResponse);
}

message DebugRequest {
  bool verbose = 1;
  DebugFormat format = 2;
}

enum DebugFormat {
  DEBUG_FORMAT_UNSPECIFIED = 0;
  DEBUG_FORMAT_YAML = 1;
  DEBUG_FORMAT_JSON = 2;
}

message DebugResponse {
  string dump = 1;
}

message ShutdownRequest {}
message ShutdownResponse {}
message SuspendRequest {
  SuspendReason reason = 1;
}

enum SuspendReason {
  SUSPEND_REASON_UNSPECIFIED = 0;
  SUSPEND_REASON_USER = 1;
  SUSPEND_REASON_UPDATE = 2;
}

message SuspendResponse {
  uint64 suspended_count = 1;
}
message ResumeRequest {}
message ResumeResponse {
  uint64 resumed_count = 1;
  uint64 failed_count = 2;
}

message ConnectToServerRequest {
  string address = 1;
}
message ConnectToServerResponse {}
