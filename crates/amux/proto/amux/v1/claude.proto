syntax = "proto3";

package amux.v1;

// Claude-specific creation config and structured protocol payloads.

message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

enum ClaudeDriver {
  CLAUDE_DRIVER_UNSPECIFIED = 0;
  CLAUDE_DRIVER_PTY = 1;
  CLAUDE_DRIVER_SDK = 2;
}

message ClaudeCreateConfig {
  string working_dir = 1;
  repeated string args = 2;
  optional TerminalSize initial_terminal_size = 10;
  ClaudeDriver driver = 11;
}

message ClaudePtyTranscriptV1Args {
  optional TerminalSize terminal_size = 1;
  optional ClaudePtyTranscriptV1ReplayQuery replay_query = 2;
}

message ClaudePtyTranscriptV1ReplayQuery {
  oneof query {
    uint64 since = 1;
    uint64 tail_count = 2;
  }
}

message ClaudePtyTranscriptV1Cursor {
  uint64 seq_id = 1;
}

message ClaudePtyTranscriptV1Input {
  uint64 expected_seq = 1;
  repeated ClaudePtyTranscriptV1Action actions = 2;
}

message ClaudePtyTranscriptV1Action {
  oneof action {
    bytes write = 1;
    uint32 delay_ms = 2;
  }
}

message ClaudePtyTranscriptV1Output {
  uint64 seq_id = 1;
  bytes payload = 2;
}

message ClaudeSdkV1Args {
  optional ClaudeSdkV1ReplayQuery replay_query = 1;
}

message ClaudeSdkV1ReplayQuery {
  oneof query {
    uint64 since = 1;
    uint64 tail_count = 2;
  }
}

message ClaudeSdkV1Output {
  uint64 seq_id = 1;
  bytes payload = 2;
}

message ClaudeSdkV1Input {
  oneof input {
    ClaudeSdkPrompt prompt = 10;
    ClaudeSdkInterrupt interrupt = 11;
    ClaudeSdkPermissionDecision permission_decision = 12;
  }
}

message ClaudeSdkPrompt {
  string text = 1;
}

message ClaudeSdkInterrupt {}

message ClaudeSdkPermissionDecision {
  string request_id = 1;
  oneof decision {
    ClaudeSdkPermissionAllow allow = 10;
    ClaudeSdkPermissionDeny deny = 11;
  }
}

message ClaudeSdkPermissionAllow {
  optional bytes updated_input_json = 1;
  repeated bytes updated_permissions_json = 2;
  optional string tool_use_id = 3;
}

message ClaudeSdkPermissionDeny {
  string message = 1;
  optional bool interrupt = 2;
  optional string tool_use_id = 3;
}
