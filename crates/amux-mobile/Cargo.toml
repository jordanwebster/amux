[package]
name = "amux-mobile"
version = "0.1.0"
edition.workspace = true
description = "C ABI for native clients of the shared amux runtime"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
amux = { workspace = true, default-features = false }
amux-ui = { workspace = true }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
