[package]
name = "amux-tui"
version = "0.4.0"
edition.workspace = true
description = "amux chrome TUI: the fleet around raw attach"

[features]
default = []
fixtures = []

# This crate consumes `amux-ui` exclusively. Depending on `amux` here is a
# review-rejectable offense — the TUI must never touch `amux::Client`.
[dependencies]
amux-ui = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
tokio = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
# Display-cell measurement for wrapping and border math — the same
# versions ratatui itself renders with, so the two never disagree.
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
amux-tui = { path = ".", features = ["fixtures"] }
tempfile = { workspace = true }
uuid = { workspace = true }
unicode-width = "0.2"
vt100 = "0.15"
