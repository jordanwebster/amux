[package]
name = "store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared SQLite cache for amux clients"
publish = false

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]
family-definition-v2-fixture = ["dep:tokio"]

[[bin]]
name = "store-family-v2-fixture"
path = "src/bin/store-family-v2-fixture.rs"
required-features = ["family-definition-v2-fixture"]
test = false
bench = false

[dependencies]
chrono = { workspace = true }
fold = { workspace = true }
model = { workspace = true }
postcard = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
